<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Герои сказок — весёлая игра для малышей</title>
<style>
/* ============================================================
   ОБЩИЕ СТИЛИ
   ============================================================ */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: 'Comic Sans MS', 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #ffdde1, #c2e9fb, #fff3b0, #d5f5e3, #e8d5ff);
  background-size: 400% 400%;
  animation: bgMove 22s ease infinite;
  min-height: 100vh;
  overflow-x: hidden;
  color: #3b2b4a;
}

@keyframes bgMove {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ---------- Фоновые украшения ---------- */
#bg-decor {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.decor {
  position: absolute;
  font-size: 42px;
  opacity: 0.35;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(20vh) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.4; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
}

/* ---------- Экраны ---------- */
.screen {
  display: none;
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding: 16px;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
.screen.active {
  display: flex;
  animation: screenIn 0.4s ease;
}
.screen.has-hud {
  padding-top: 100px;
}
@keyframes screenIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   ВЕРХНЯЯ ПАНЕЛЬ (HUD)
   ============================================================ */
.hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 4px solid rgba(255, 255, 255, 0.95);
  box-shadow: 0 6px 24px rgba(120, 90, 180, 0.18);
  transition: transform 0.3s ease, opacity 0.3s ease;
}
.hud.hidden {
  transform: translateY(-120%);
  opacity: 0;
  pointer-events: none;
}
.hud-title {
  font-size: 22px;
  font-weight: bold;
  color: #7b5ea7;
  flex: 1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  width: 60px;
  height: 60px;
  min-width: 60px;
  border-radius: 18px;
  border: 3px solid #fff;
  background: linear-gradient(180deg, #ffd93d, #ffb52e);
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 5px 0 #d99400;
  transition: transform 0.12s, box-shadow 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}
.icon-btn:active {
  transform: translateY(5px);
  box-shadow: 0 0 0 #d99400;
}
.hud-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hud-stars {
  background: linear-gradient(180deg, #fff7cf, #ffe680);
  border: 3px solid #fff;
  border-radius: 16px;
  padding: 8px 14px;
  font-size: 22px;
  font-weight: bold;
  color: #8a6400;
  box-shadow: 0 4px 0 #e0b800;
  white-space: nowrap;
}
.hud-progress {
  background: linear-gradient(180deg, #d6ecff, #a9d6ff);
  border: 3px solid #fff;
  border-radius: 16px;
  padding: 8px 14px;
  font-size: 20px;
  font-weight: bold;
  color: #20527f;
  box-shadow: 0 4px 0 #7fb6e8;
  white-space: nowrap;
}

/* ============================================================
   ГЛАВНОЕ МЕНЮ
   ============================================================ */
#screen-menu {
  justify-content: center;
  text-align: center;
}
.title {
  font-size: clamp(34px, 8vw, 62px);
  margin: 0 0 6px;
  color: #fff;
  text-shadow:
    0 4px 0 #b57edc,
    0 8px 0 #8e5fc0,
    0 12px 22px rgba(90, 50, 140, 0.35);
  letter-spacing: 1px;
  animation: titleBounce 2.4s ease-in-out infinite;
}
@keyframes titleBounce {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50%      { transform: translateY(-10px) rotate(1deg); }
}
.subtitle {
  font-size: clamp(18px, 4vw, 26px);
  color: #6b4f96;
  margin: 0 0 28px;
  font-weight: bold;
}
.menu-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  align-items: stretch;
}
.menu-btn {
  width: 210px;
  height: 210px;
  border-radius: 34px;
  border: 5px solid #fff;
  font-size: 70px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  color: #fff;
  font-family: inherit;
  transition: transform 0.15s, box-shadow 0.15s;
  line-height: 1;
}
.menu-btn span {
  font-size: 22px;
  font-weight: bold;
  padding: 0 8px;
  text-align: center;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
}
.menu-btn:nth-child(1) {
  background: linear-gradient(180deg, #ff9a9e, #ff6b81);
  box-shadow: 0 10px 0 #d63f57, 0 16px 30px rgba(214, 63, 87, 0.35);
}
.menu-btn:nth-child(2) {
  background: linear-gradient(180deg, #7ed6ff, #3fa9f5);
  box-shadow: 0 10px 0 #1c7cc4, 0 16px 30px rgba(28, 124, 196, 0.35);
}
.menu-btn:nth-child(3) {
  background: linear-gradient(180deg, #a8e063, #56ab2f);
  box-shadow: 0 10px 0 #3c7d1e, 0 16px 30px rgba(60, 125, 30, 0.35);
}
.menu-btn:hover { transform: translateY(-6px); }
.menu-btn:active {
  transform: translateY(8px);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
}
.best-box {
  margin-top: 32px;
  background: rgba(255, 255, 255, 0.85);
  border: 4px solid #fff;
  border-radius: 24px;
  padding: 14px 26px;
  font-size: 22px;
  font-weight: bold;
  color: #7b5ea7;
  box-shadow: 0 8px 24px rgba(120, 90, 180, 0.18);
}

/* ============================================================
   ИГРОВАЯ КАРТОЧКА
   ============================================================ */
.game-card {
  width: 100%;
  max-width: 860px;
  background: rgba(255, 255, 255, 0.9);
  border: 6px solid #fff;
  border-radius: 34px;
  padding: 22px 20px 28px;
  box-shadow: 0 14px 40px rgba(120, 90, 180, 0.22);
  text-align: center;
}
.game-title {
  font-size: clamp(24px, 5vw, 34px);
  margin: 0 0 6px;
  color: #7b5ea7;
}
.question-text {
  font-size: clamp(20px, 4vw, 26px);
  color: #6b4f96;
  margin: 0 0 8px;
  font-weight: bold;
}
.feedback {
  min-height: 40px;
  font-size: clamp(22px, 4.5vw, 30px);
  font-weight: bold;
  margin-top: 10px;
  transition: opacity 0.2s;
}
.feedback.good { color: #2e9e46; }
.feedback.bad  { color: #e0623f; }

/* ============================================================
   ИГРА 1 — УГАДАЙ ГЕРОЯ
   ============================================================ */
.hero-wrap {
  animation: sway 3.2s ease-in-out infinite;
  display: inline-block;
}
@keyframes sway {
  0%, 100% { transform: rotate(-4deg) translateY(0); }
  50%      { transform: rotate(4deg) translateY(-10px); }
}
.hero-display {
  font-size: clamp(90px, 22vw, 150px);
  line-height: 1.1;
  filter: drop-shadow(0 10px 14px rgba(90, 50, 140, 0.28));
  display: inline-block;
  cursor: pointer;
}
.hero-display.pop {
  animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn {
  0%   { transform: scale(0.3) rotate(-15deg); opacity: 0; }
  60%  { transform: scale(1.18) rotate(6deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); }
}
.options {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  margin-top: 18px;
}
.option-btn {
  min-width: 170px;
  min-height: 84px;
  padding: 14px 26px;
  font-size: clamp(22px, 4.5vw, 28px);
  font-family: inherit;
  font-weight: bold;
  border-radius: 24px;
  border: 4px solid #fff;
  background: linear-gradient(180deg, #ffffff, #eef4ff);
  color: #3b2b4a;
  cursor: pointer;
  box-shadow: 0 7px 0 rgba(120, 90, 180, 0.28);
  transition: transform 0.12s, box-shadow 0.12s, background 0.2s, color 0.2s;
}
.option-btn:hover { transform: translateY(-3px); }
.option-btn:active {
  transform: translateY(6px);
  box-shadow: 0 1px 0 rgba(120, 90, 180, 0.28);
}
.option-btn.correct {
  background: linear-gradient(180deg, #8ee89b, #4cc764);
  color: #fff;
  border-color: #fff;
  animation: correctPulse 0.6s ease;
}
@keyframes correctPulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.option-btn.wrong {
  background: linear-gradient(180deg, #ffc9c9, #ff9d9d);
  color: #a33;
  opacity: 0.65;
}
.shake {
  animation: shakeAnim 0.5s ease;
}
@keyframes shakeAnim {
  0%, 100% { transform: translateX(0); }
  15%      { transform: translateX(-10px) rotate(-3deg); }
  30%      { transform: translateX(10px) rotate(3deg); }
  45%      { transform: translateX(-8px) rotate(-2deg); }
  60%      { transform: translateX(8px) rotate(2deg); }
  80%      { transform: translateX(-4px); }
}

/* ============================================================
   ИГРА 2 — НАЙДИ ПАРУ (МЕМОРИ)
   ============================================================ */
.memory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 16px;
  width: 100%;
}
.mem-card {
  perspective: 900px;
  aspect-ratio: 1 / 1;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
}
.mem-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
}
.mem-card.flipped .mem-inner,
.mem-card.matched .mem-inner {
  transform: rotateY(180deg);
}
.mem-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 22px;
  font-size: clamp(38px, 9vw, 62px);
  line-height: 1;
}
.mem-back {
  background: linear-gradient(150deg, #8ecbff, #3fa9f5);
  color: #fff;
  border: 4px solid #fff;
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.15), 0 6px 0 #1c7cc4;
  font-size: clamp(34px, 8vw, 52px);
}
.mem-front {
  background: linear-gradient(180deg, #ffffff, #fff8e0);
  border: 4px solid #ffd93d;
  transform: rotateY(180deg);
  box-shadow: 0 6px 0 #e0b800;
}
.mem-card.matched .mem-front {
  border-color: #6bcb77;
  background: linear-gradient(180deg, #ffffff, #e2ffe9);
  box-shadow: 0 6px 0 #3fa04f;
}
.mem-card.matched {
  animation: matchPop 0.55s ease;
}
@keyframes matchPop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.mem-card.matched .mem-front::after {
  content: '✅';
  position: absolute;
  bottom: 4px;
  right: 6px;
  font-size: 20px;
}

/* ============================================================
   ИГРА 3 — СОБЕРИ СКАЗКУ
   ============================================================ */
.slots {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 18px 0 6px;
}
.slot {
  width: 92px;
  height: 92px;
  border-radius: 22px;
  border: 4px dashed #c0a9e6;
  background: rgba(255, 255, 255, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-size: 44px;
  line-height: 1;
  transition: background 0.25s, border-color 0.25s;
}
.slot .slot-num {
  position: absolute;
  top: -12px;
  left: -8px;
  background: #ffd93d;
  color: #7a5b00;
  font-size: 15px;
  font-weight: bold;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
}
.slot.filled {
  border-style: solid;
  border-color: #6bcb77;
  background: linear-gradient(180deg, #ffffff, #e2ffe9);
}
.slot.filled.pop {
  animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.pool {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 4px dotted #d9cbf0;
}
.pool-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 94px;
  min-height: 94px;
  padding: 8px 12px;
  border-radius: 22px;
  border: 4px solid #fff;
  background: linear-gradient(180deg, #ffffff, #eef4ff);
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 7px 0 rgba(120, 90, 180, 0.28);
  transition: transform 0.12s, box-shadow 0.12s, opacity 0.3s;
  font-size: 42px;
  line-height: 1;
}
.pool-item .pool-name {
  font-size: 14px;
  font-weight: bold;
  color: #5b4a70;
  max-width: 110px;
  text-align: center;
  line-height: 1.1;
}
.pool-item:hover { transform: translateY(-4px); }
.pool-item:active {
  transform: translateY(5px);
  box-shadow: 0 1px 0 rgba(120, 90, 180, 0.28);
}
.pool-item.used {
  opacity: 0.25;
  pointer-events: none;
  transform: scale(0.85);
}

/* ============================================================
   ЭКРАН ПОБЕДЫ
   ============================================================ */
#screen-win {
  justify-content: center;
}
.win-card {
  width: 100%;
  max-width: 620px;
  background: rgba(255, 255, 255, 0.95);
  border: 8px solid #fff;
  border-radius: 40px;
  padding: 26px 22px 30px;
  text-align: center;
  box-shadow: 0 18px 50px rgba(120, 90, 180, 0.3);
  animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.win-emoji {
  font-size: clamp(70px, 16vw, 110px);
  animation: winBounce 1.1s ease-in-out infinite;
  display: inline-block;
}
@keyframes winBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-16px) scale(1.06); }
}
.win-card h2 {
  font-size: clamp(28px, 6vw, 42px);
  color: #7b5ea7;
  margin: 6px 0 10px;
}
.win-card p {
  font-size: clamp(19px, 4vw, 24px);
  color: #6b4f96;
  margin: 0 0 16px;
  font-weight: bold;
}
.win-stars {
  font-size: clamp(30px, 7vw, 44px);
  line-height: 1.4;
  margin-bottom: 14px;
  min-height: 50px;
}
.win-stars span {
  display: inline-block;
  animation: starPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes starPop {
  0%   { transform: scale(0) rotate(-90deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.win-best {
  font-size: 20px;
  color: #a08bc4;
  margin-bottom: 20px;
  font-weight: bold;
}
.win-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
}
.big-btn {
  min-height: 84px;
  padding: 16px 30px;
  font-size: clamp(20px, 4vw, 26px);
  font-family: inherit;
  font-weight: bold;
  border-radius: 26px;
  border: 4px solid #fff;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(180deg, #8ee89b, #4cc764);
  box-shadow: 0 8px 0 #349a4a;
  transition: transform 0.12s, box-shadow 0.12s;
}
.big-btn.secondary {
  background: linear-gradient(180deg, #b8c6ff, #7d92f5);
  box-shadow: 0 8px 0 #4f63c4;
}
.big-btn:active {
  transform: translateY(6px);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
}

/* ============================================================
   ВСПЫШКА И КОНФЕТТИ
   ============================================================ */
#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 900;
  transition: opacity 0.3s ease;
}
#flash.on { opacity: 0.55; }
#flash.green {
  background: radial-gradient(circle at center, rgba(107, 203, 119, 0.95), rgba(107, 203, 119, 0) 70%);
}
#flash.red {
  background: radial-gradient(circle at center, rgba(255, 140, 140, 0.85), rgba(255, 140, 140, 0) 70%);
}

#confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 999;
}
.confetti-piece {
  position: absolute;
  top: -30px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% {
    transform: translateY(0) rotate(0deg) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(760deg) scale(0.85);
   h opacity: 0.85;
  }
}

/* ============================================================
   АudДАПТИВ-proНОСТЬ
   ============================================================ */
@media (maxgress-width:  {620px) {
  .memory-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }
  .menu-btn {
    width: 150px;
    height: 150px;
    font-size: 54px;
    border-radius: 28px;
  }
  .menu-btn span { font-size: 18px; }
  .slot { width: 74px; height: 74px; font-size: 36px; border-radius: 18px; }
  .pool-item { min-width: 78px; min-height: 78px; font-size: 34px; border-radius: 18px; }
  .pool-item .pool-name { font-size: 12px; }
  .hud-title { font-size: 17px; }
  .hud-stars, . font-size: 17px; padding: 6px 10px; }
  .icon-btn { width: 52px; height: 52px; min-width: 52px; font-size: 24px; }
  .screen.has-hud { padding-top: 86px; }
  .game-card { padding: 16px 12px 22px; border-radius: 26px; }
}

@media (max-width: 400px) {
  .memory-grid { grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .option-btn { min-width: 130px; min-height: 72px; padding: 10px 18px; }
}

/* Уважаем тех, кто предпочитает меньше анимации */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- Фоновые украшения -->
<div id="bg-decor" aria-hidden="true"></div>

<!-- Вспышка на весь экран -->
<div id="flash" aria-hidden="true"></div>

<!-- Слой для конфетти -->
<div id="confetti-layer" aria-hidden="true"></div>

<!-- ============================================================
     ВЕРХНЯЯ ПАНЕЛЬ
     ============================================================ -->
<header class="hud hidden" id="hud">
  <button class="icon-btn" id="btn-home" title="В меню" aria-label="В меню">🏠</button>
  <div class="hud-title" id="hud-title">Герои сказок</div>
  <div class="hud-right">
    <div class="hud-stars" id="hud-stars">⭐ 0</div>
    <div class="hud-progress" id="hud-progress">1 / 1</div>
  </div>
</header>

<!-- ============================================================
     ЭКРАН 1: ГЛАВНОЕ МЕНЮ
     ============================================================ -->
<section id="screen-menu" class="screen active">
  <h1 class="title">Герои сказок</h1>
  <p class="subtitle">Играем и учимся вместе! 🎈</p>

  <div class="menu-grid">
    <button class="menu-btn" data-game="1">🔍<span>Угадай героя</span></button>
    <button class="menu-btn" data-game="2">🃏<span>Найди пару</span></button>
    <button class="menu-btn" data-game="3">📖<span>Собери сказку</span></button>
  </div>

  <div class="best-box">🏆 Лучший результат: <span id="best-score">0</span> ⭐</div>
</section>

<!-- ============================================================
     ЭКРАН 2: ИГРА «УГАДАЙ ГЕРОЯ»
     ============================================================ -->
<section id="screen-game1" class="screen has-hud">
  <div class="game-card">
    <h2 class="game-title">🔍 Угадай героя</h2>

<script>
/* ============================================================
   БЛОК 1. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ============================================================ */

/** Перемешивание массива (алгоритм Фишера–Йетса) */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Случайный элемент массива */
function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ============================================================
   БЛОК 2. ЗВУК (Web Audio API)
   ============================================================ */

let audioCtx = null;

/** Ленивое создание аудиоконтекста (нужно после действия пользователя) */
function getAudioCtx() {
  if (!audioCtx) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    } catch (e) {
      audioCtx = null;
    }
  }
  return audioCtx;
}

/** Проиграть один короткий тон */
function playTone(freq, duration, type, delay, volume) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  type = type || 'sine';
  delay = delay || 0;
  volume = volume === undefined ? 0.16 : volume;

  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);

  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(volume, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.05);
}

/** Приятный «пик» — правильный ответ */
function soundCorrect() {
  playTone(660, 0.13, 'sine', 0, 0.18);
  playTone(880, 0.15, 'sine', 0.11, 0.18);
  playTone(1320, 0.24, 'sine', 0.23, 0.16);
}

/** Мягкий «блуп» — неправильный ответ (не пугающий) */
function soundWrong() {
  playTone(300, 0.16, 'sine', 0, 0.14);
  playTone(200, 0.24, 'sine', 0.14, 0.13);
}

/** Короткий клик */
function soundClick() {
  playTone(540, 0.07, 'triangle', 0, 0.09);
}

/** Звук переворота карточки */
function soundFlip() {
  playTone(480, 0.08, 'triangle', 0, 0.09);
  playTone(640, 0.07, 'triangle', 0.06, 0.07);
}

/** Победная мелодия */
function soundWin() {
  const notes = [523, 659, 784, 1047, 784, 1047, 1319];
  notes.forEach((n, i) => playTone(n, 0.22, 'sine', i * 0.14, 0.16));
}

/* ============================================================
   БЛОК 3. РЕЧЬ (SpeechSynthesis API)
   ============================================================ */

let lastSpeakTime = 0;

/**
 * Произнести текст по-русски.
 * @param {string} text — что сказать
 * @param {boolean} force — игнорировать защиту от частых вызовов
 */
function speak(text, force) {
  if (!('speechSynthesis' in window) || !text) return;

  const now = Date.now();
  if (!force && now - lastSpeakTime < 300) return;
  lastSpeakTime = now;

  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ru-RU';
    utter.rate = 0.92;
    utter.pitch = 1.15;
    utter.volume = 1;

    // Пытаемся найти русский голос
    const voices = window.speechSynthesis.getVoices();
    if (voices && voices.length) {
      const ru = voices.find(v => v.lang && v.lang.toLowerCase().indexOf('ru') === 0);
      if (ru) utter.voice = ru;
    }

    window.speechSynthesis.speak(utter);
  } catch (e) {
    /* Если API недоступен — просто молчим */
  }
}

/** Остановить речь */
function stopSpeak() {
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

// Подгружаем голоса заранее (в некоторых браузерах они появляются асинхронно)
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = function () {
    try { window.speechSynthesis.getVoices(); } catch (e) {}
  };
}

/* ============================================================
   БЛОК 4. ВИЗУАЛЬНЫЕ ЭФФЕКТЫ
   ============================================================ */

/** Цветная вспышка на весь экран */
function flash(color) {
  const el = document.getElementById('flash');
  el.className = color;
  void el.offsetWidth;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 420);
}

/** Конфетти */
function confetti(count) {
  count = count || 36;
  const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF',
                  '#FF8FAB', '#B983FF', '#FFA45B', '#4DD0E1'];
  const layer = document.getElementById('confetti-layer');

  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 8 + Math.random() * 12;

    piece.style.left = (Math.random() * 100) + 'vw';
    piece.style.width = size + 'px';
    piece.style.height = (size * (0.6 + Math.random() * 0.8)) + 'px';
    piece.style.background = pickRandom(colors);
    piece.style.animationDuration = (1.5 + Math.random() * 1.4) + 's';
    piece.style.animationDelay = (Math.random() * 0.25) + 's';
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';

    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 3400);
  }
}

/** Показать текст обратной связи */
function showFeedback(elementId, text, isGood) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.textContent = text;
  el.className = 'feedback ' + (isGood ? 'good' : 'bad');
}

/* ============================================================
   БЛОК 5. ФОНОВЫЕ УКРАШЕНИЯ
   ============================================================ */

(function createBackgroundDecor() {
  const container = document.getElementById('bg-decor');
  const emojis = ['⭐', '🌈', '☁️', '🎈', '🌸', '✨', '🍭', '🌼', '🦋', '💫'];

  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'decor';
    el.textContent = pickRandom(emojis);
    el.style.left = (Math.random() * 96) + 'vw';
    el.style.fontSize = (26 + Math.random() * 34) + 'px';
    el.style.animationDuration = (16 + Math.random() * 18) + 's';
    el.style.animationDelay = (-Math.random() * 20) + 's';
    container.appendChild(el);
  }
})();

/* ============================================================
   БЛОК 6. УПРАВЛЕНИЕ ЭКРАНАМИ И СЧЁТОМ
   ============================================================ */

const hud = document.getElementById('hud');
const hudTitle = document.getElementById('hud-title');
const hudStars = document.getElementById('hud-stars');
const hudProgress = document.getElementById('hud-progress');

let currentStars = 0;   // звёзды за текущую партию
let lastGame = 1;       // последняя запущенная игра (для «Играть снова»)

/** Показать нужный экран */
function showScreen(screenId, withHud, title) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const screen = document.getElementById(screenId);
  if (screen) screen.classList.add('active');

  if (withHud) {
    hud.classList.remove('hidden');
    hudTitle.textContent = title || 'Герои сказок';
  } else {
    hud.classList.add('hidden');
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/** Обновить счёт звёзд в панели */
function updateHudStars() {
  hudStars.textContent = '⭐ ' + currentStars;
}

/** Обновить прогресс в панели */
function updateHudProgress(text) {
  hudProgress.textContent = text;
}

/* ---------- Работа с localStorage ---------- */

function getBest(gameNumber) {
  try {
    return parseInt(localStorage.getItem('skazki_best_' + gameNumber) || '0', 10) || 0;
  } catch (e) {
    return 0;
  }
}

function setBest(gameNumber, value) {
  try {
    if (value > getBest(gameNumber)) {
      localStorage.setItem('skazki_best_' + gameNumber, String(value));
    }
  } catch (e) { /* localStorage может быть недоступен */ }
}

function getTotalBest() {
  return getBest(1) + getBest(2) + getBest(3);
}

function updateBestDisplay() {
  const el = document.getElementById('best-score');
  if (el) el.textContent = getTotalBest();
}

/* ============================================================
   БЛОК 7. ИГРА 1 — «УГАДАЙ ГЕРОЯ»
   ============================================================ */

/** Пул героев для игры «Угадай героя» */
const heroPool = [
  { emoji: '🐻', name: 'Медведь' },
  { emoji: '🐺', name: 'Волк' },
  { emoji: '🦊', name: 'Лиса' },
  { emoji: '🐰', name: 'Заяц' },
  { emoji: '🐸', name: 'Лягушка' },
  { emoji: '🐭', name: 'Мышка' },
  { emoji: '🐔', name: 'Курочка Ряба' },
  { emoji: '🐷', name: 'Поросёнок' },
  { emoji: '👧', name: 'Красная Шапочка' },
  { emoji: '👸', name: 'Принцесса' },
  { emoji: '🤴', name: 'Принц' },
  { emoji: '🧙', name: 'Волшебник' },
  { emoji: '🐉', name: 'Дракон' },
  { emoji: '👴', name: 'Дед' },
  { emoji: '👵', name: 'Бабушка' }
];

const TOTAL_QUESTIONS = 10;

const g1 = {
  questions: [],
  index: 0,
  locked: false
};

/** Собрать 10 вопросов со случайными вариантами ответов */
function buildQuestions() {
  const shuffledPool = shuffle(heroPool);
  const questions = [];

  for (let i = 0; i < TOTAL_QUESTIONS; i++) {
    const hero = shuffledPool[i % shuffledPool.length];

    // Два неверных варианта из остальных героев
    const others = heroPool.filter(h => h.name !== hero.name);
    const wrongs = shuffle(others).slice(0, 2);

    questions.push({
      emoji: hero.emoji,
      answer: hero.name,
      options: shuffle([hero.name, wrongs[0].name, wrongs[1].name])
    });
  }
  return questions;
}

/** Запуск игры 1 */
function startGame1() {
  lastGame = 1;
  g1.questions = buildQuestions();
  g1.index = 0;
  g1.locked = false;
  currentStars = 0;
  updateHudStars();
  showScreen('screen-game1', true, '🔍 Угадай героя');
  renderQuestion1();
}

/** Показать текущий вопрос */
function renderQuestion1() {
  const q = g1.questions[g1.index];
  if (!q) return;

  g1.locked = false;

  const emojiEl = document.getElementById('g1-emoji');
  emojiEl.textContent = q.emoji;
  emojiEl.classList.remove('pop');
  void emojiEl.offsetWidth;
  emojiEl.classList.add('pop');

  document.getElementById('g1-question').textContent = 'Кто это?';
  document.getElementById('g1-feedback').textContent = '';
  document.getElementById('g1-feedback').className = 'feedback';

  const optionsBox = document.getElementById('g1-options');
  optionsBox.innerHTML = '';

  q.options.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = name;
    btn.onclick = () => answerQuestion1(btn, name, q);
    btn.onmouseenter = () => speak(name);
    optionsBox.appendChild(btn);
  });

  updateHudProgress((g1.index + 1) + ' / ' + TOTAL_QUESTIONS);
  speak('Кто это?', true);
}

/** Обработка ответа в игре 1 */
function answerQuestion1(btn, name, q) {
  if (g1.locked) return;

  if (name === q.answer) {
    /* ---- ПРАВИЛЬНО ---- */
    g1.locked = true;
    btn.classList.add('correct');
    flash('green');
    soundCorrect();
    confetti(30);
    currentStars++;
    updateHudStars();
    showFeedback('g1-feedback', 'Молодец! 🎉', true);
    speak('Молодец! Это ' + name, true);

    setTimeout(() => {
      g1.index++;
      if (g1.index >= g1.questions.length) {
        endGame(1);
      } else {
        renderQuestion1();
      }
    }, 1500);

  } else {
    /* ---- НЕПРАВИЛЬНО (без штрафов) ---- */
    btn.classList.add('wrong');
    btn.disabled = true;
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
    flash('red');
    soundWrong();
    showFeedback('g1-feedback', 'Попробуй ещё 🙂', false);
    speak('Попробуй ещё', true);
  }
}

/* ============================================================
   БЛОК 8. ИГРА 2 — «НАЙДИ ПАРУ» (МЕМОРИ)
   ============================================================ */

/** Пары «герой → предмет/друг» */
const memoryPairs = [
  { a: '👧', an: 'Красная Шапочка', b: '🥧', bn: 'Пирожок' },
  { a: '👸', an: 'Золушка',         b: '👠', bn: 'Туфелька' },
  { a: '🪵', an: 'Буратино',        b: '🔑', bn: 'Золотой ключик' },
  { a: '👴', an: 'Дед',             b: '🥕', bn: 'Репка' },
  { a: '🐔', an: 'Курочка Ряба',    b: '🥚', bn: 'Золотое яйцо' },
  { a: '🐻', an: 'Медведь',         b: '🏠', bn: 'Теремок' },
  { a: '🐺', an: 'Волк',            b: '🐷', bn: 'Поросёнок' },
  { a: '🧙', an: 'Волшебник',       b: '🪄', bn: 'Волшебная палочка' }
];

const PAIRS_COUNT = 6;

const g2 = {
  deck: [],
  flipped: [],
  matched: 0,
  locked: false
};

/** Запуск игры 2 */
function startGame2() {
  lastGame = 2;

  const chosenPairs = shuffle(memoryPairs).slice(0, PAIRS_COUNT);

  // Создаём колоду: по 2 карточки на пару
  g2.deck = [];
  chosenPairs.forEach((pair, pairId) => {
    g2.deck.push({ pairId: pairId, emoji: pair.a, name: pair.an });
    g2.deck.push({ pairId: pairId, emoji: pair.b, name: pair.bn });
  });
  shuffle(g2.deck);

  g2.flipped = [];
  g2.matched = 0;
  g2.locked = false;

  currentStars = 0;
  updateHudStars();
  updateHudProgress('0 / ' + PAIRS_COUNT);

  showScreen('screen-game2', true, '🃏 Найди пару');
  renderMemory2();
  speak('Найди пару для каждого героя!', true);
}

/** Отрисовать поле мемори */
function renderMemory2() {
  const grid = document.getElementById('g2-grid');
  grid.innerHTML = '';
  document.getElementById('g2-feedback').textContent = '';
  document.getElementById('g2-feedback').className = 'feedback';

  g2.deck.forEach((card, idx) => {
    const cardEl = document.createElement('button');
    cardEl.className = 'mem-card';
    cardEl.setAttribute('aria-label', 'Карточка');

    cardEl.innerHTML =
      '<div class="mem-inner">' +
        '<div class="mem-face mem-back">❓</div>' +
        '<div class="mem-face mem-front">' + card.emoji + '</div>' +
      '</div>';

    cardEl.addEventListener('click', () => onMemoryClick(cardEl, card, idx));
    grid.appendChild(cardEl);
  });
}

/** Клик по карточке в мемори */
function onMemoryClick(cardEl, card, idx) {
  if (g2.locked) return;
  if (cardEl.classList.contains('flipped')) return;
  if (cardEl.classList.contains('matched')) return;

  soundFlip();
  cardEl.classList.add('flipped');
  speak(card.name);

  g2.flipped.push({ el: cardEl, data: card, idx: idx });

  if (g2.flipped.length === 2) {
    g2.locked = true;
    const first = g2.flipped[0];
    const second = g2.flipped[1];

    if (first.data.pairId === second.data.pairId && first.idx !== second.idx) {
      /* ---- ПАРА НАЙДЕНА ---- */
      setTimeout(() => {
        first.el.classList.add('matched');
        second.el.classList.add('matched');

        soundCorrect();
        confetti(26);
        currentStars++;
        updateHudStars();

        g2.matched++;
        updateHudProgress(g2.matched + ' / ' + PAIRS_COUNT);
        showFeedback('g2-feedback', 'Молодец! 🎉', true);

        g2.flipped = [];
        g2.locked = false;

        if (g2.matched === PAIRS_COUNT) {
          setTimeout(() => endGame(2), 1000);
        }
      }, 450);

    } else {
      /* ---- НЕ ПАРА ---- */
      setTimeout(() => {
        first.el.classList.remove('flipped');
        second.el.classList.remove('flipped');
        soundWrong();
        showFeedback('g2-feedback', 'Попробуй ещё 🙂', false);
        g2.flipped = [];
        g2.locked = false;
      }, 1000);
    }
  }
}

/* ============================================================
   БЛОК 9. ИГРА 3 — «СОБЕРИ СКАЗКУ»
   ============================================================ */

/** Сказки с правильным порядком героев */
const stories = [
  {
    title: '🥕 Репка',
    hint: 'Кто за кем тянул репку? Нажимай по порядку!',
    items: [
      { emoji: '👴', name: 'Дед' },
      { emoji: '👵', name: 'Бабка' },
      { emoji: '👧', name: 'Внучка' },
      { emoji: '🐕', name: 'Жучка' },
      { emoji: '🐈', name: 'Кошка' },
      { emoji: '🐭', name: 'Мышка' }
    ]
  },
  {
    title: '🏠 Теремок',
    hint: 'Кто первым поселился в теремке?',
    items: [
      { emoji: '🐭', name: 'Мышка-норушка' },
      { emoji: '🐸', name: 'Лягушка-квакушка' },
      { emoji: '🐰', name: 'Зайчик-побегайчик' },
      { emoji: '🦊', name: 'Лисичка-сестричка' },
      { emoji: '🐺', name: 'Волчок — серый бочок' },
      { emoji: '🐻', name: 'Медведь' }
    ]
  }
];

const g3 = {
  storyIndex: 0,
  placed: 0,
  locked: false
};

/** Запуск игры 3 */
function startGame3() {
  lastGame = 3;
  g3.storyIndex = 0;
  g3.placed = 0;
  g3.locked = false;
  currentStars = 0;
  updateHudStars();
  showScreen('screen-game3', true, '📖 Собери сказку');
  renderStory3();
}

/** Отрисовать текущую сказку */
function renderStory3() {
  const story = stories[g3.storyIndex];
  if (!story) return;

  g3.placed = 0;
  g3.locked = false;

  document.getElementById('g3-title').textContent = '📖 ' + story.title;
  document.getElementById('g3-hint').textContent = story.hint;
  document.getElementById('g3-feedback').textContent = '';
  document.getElementById('g3-feedback').className = 'feedback';

  updateHudProgress((g3.storyIndex + 1) + ' / ' + stories.length);

  /* --- Пустые слоты по порядку --- */
  const slotsBox = document.getElementById('g3-slots');
  slotsBox.innerHTML = '';
  story.items.forEach((item, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.slot = i;
    slot.innerHTML = '<span class="slot-num">' + (i + 1) + '</span>';
    slotsBox.appendChild(slot);
  });

  /* --- Перемешанные герои внизу --- */
  const poolBox = document.getElementById('g3-pool');
  poolBox.innerHTML = '';

  const shuffledItems = shuffle(story.items.map((it, i) => ({
    emoji: it.emoji,
    name: it.name,
    idx: i
  })));

  shuffledItems.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'pool-item';
    btn.innerHTML =
      '<span class="pool-emoji">' + item.emoji + '</span>' +
      '<span class="pool-name">' + item.name + '</span>';
    btn.onclick = () => pickStoryItem(btn, item, story);
    btn.onmouseenter = () => speak(item.name);
    poolBox.appendChild(btn);
  });

  speak(story.hint, true);
}

/** Клик по герою в игре 3 */
function pickStoryItem(btn, item, story) {
  if (g3.locked) return;
  if (btn.classList.contains('used')) return;

  if (item.idx === g3.placed) {
    /* ---- ПРАВИЛЬНЫЙ ПОРЯДОК ---- */
    btn.classList.add('used');

    const slot = document.querySelector('#g3-slots .slot[data-slot="' + g3.placed + '"]');
    if (slot) {
      slot.innerHTML =
        '<span class="slot-num">' + (g3.placed + 1) + '</span>' +
        '<span class="pool-emoji">' + item.emoji + '</span>';
      slot.classList.add('filled', 'pop');
    }

    soundCorrect();
    confetti(18);
    currentStars++;
    updateHudStars();
    speak(item.name);
    showFeedback('g3-feedback', 'Верно! 🎉', true);

    g3.placed++;

    if (g3.placed === story.items.length) {
      g3.locked = true;
      showFeedback('g3-feedback', 'Сказка собрана! 🌟', true);
      setTimeout(() => {
        g3.storyIndex++;
        if (g3.storyIndex >= stories.length) {
          endGame(3);
        } else {
          renderStory3();
        }
      }, 1500);
    }

  } else {
    /* ---- НЕПРАВИЛЬНО ---- */
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
    soundWrong();
    showFeedback('g3-feedback', 'Попробуй ещё 🙂', false);
    speak('Попробуй ещё', true);
  }
}

/* ============================================================
   БЛОК 10. ЗАВЕРШЕНИЕ ИГРЫ И ЭКРАН ПОБЕДЫ
   ============================================================ */

/** Завершить игру: сохранить результат и показать экран победы */
function endGame(gameNumber) {
  setBest(gameNumber, currentStars);
  updateBestDisplay();

  // Праздничный эффект
  confetti(90);
  soundWin();

  const titles = {
    1: 'Умница! Все герои угаданы! 🎉',
    2: 'Отлично! Все пары найдены! 🎉',
    3: 'Здорово! Все сказки собраны! 🎉'
  };

  document.getElementById('win-title').textContent = titles[gameNumber] || 'Молодец!';
  document.getElementById('win-text').textContent =
    'Ты заработал ' + currentStars + ' ' + pluralStars(currentStars) + '!';

  /* Рисуем звёздочки с анимацией */
  const starsBox = document.getElementById('win-stars');
  starsBox.innerHTML = '';
  const shown = Math.min(currentStars, 12);
  for (let i = 0; i < shown; i++) {
    const s = document.createElement('span');
    s.textContent = '⭐';
    s.style.animationDelay = (i * 0.08) + 's';
    starsBox.appendChild(s);
  }

  const best = getBest(gameNumber);
  document.getElementById('win-best').textContent =
    '🏆 Твой рекорд в этой игре: ' + best + ' ⭐';

  showScreen('screen-win', false);
  speak('Молодец! Ты заработал ' + currentStars + ' звёздочек!', true);
}

/** Правильная форма слова «звёздочка» */
function pluralStars(n) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'звёздочку';
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'звёздочки';
  return 'звёздочек';
}

/* ============================================================
   БЛОК 11. ОБРАБОТЧИКИ СОБЫТИЙ
   ============================================================ */

/* --- Кнопки меню --- */
document.querySelectorAll('.menu-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    soundClick();
    const game = parseInt(btn.dataset.game, 10);
    if (game === 1) startGame1();
    else if (game === 2) startGame2();
    else if (game === 3) startGame3();
  });
});

/* --- Кнопка «Домой» --- */
document.getElementById('btn-home').addEventListener('click', () => {
  soundClick();
  stopSpeak();
  updateBestDisplay();
  showScreen('screen-menu', false);
});

/* --- Клик по герою в игре 1 (озвучка) --- */
document.getElementById('g1-emoji').addEventListener('click', () => {
  const q = g1.questions[g1.index];
  if (q) {
    // Герой «называет себя» только после правильного ответа,
    // поэтому здесь просто подбадриваем
    speak('Кто это?');
    const el = document.getElementById('g1-emoji');
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }
});

/* --- Кнопки на экране победы --- */
document.getElementById('btn-again').addEventListener('click', () => {
  soundClick();
  if (lastGame === 1) startGame1();
  else if (lastGame === 2) startGame2();
  else startGame3();
});

document.getElementById('btn-menu').addEventListener('click', () => {
  soundClick();
  stopSpeak();
  updateBestDisplay();
  showScreen('screen-menu', false);
});

/* --- Разблокировка аудио после первого касания --- */
document.addEventListener('pointerdown', function unlockAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
  }
  document.removeEventListener('pointerdown', unlockAudio);
}, { once: true });

/* ============================================================
   БЛОК 12. ИНИЦИАЛИЗАЦИЯ
   ============================================================ */

(function init() {
  updateBestDisplay();
  updateHudStars();
  showScreen('screen-menu', false);
})();
</script>
