<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сказка-игра 🦊 Создай героя</title>
<style>
  *,*::before,*::after{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;
    font-family:'Nunito','Comic Sans MS','Segoe UI',system-ui,sans-serif;
    background:#e8f7e4;
    color:#2f3542;
    display:flex;
    justify-content:center;
    min-height:100vh;
    transition:background .7s ease;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #app{width:100%;max-width:860px;padding:16px 16px 40px;}

  .screen{animation:fadeUp .45s ease both;}
  .screen.center{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:calc(100vh - 80px);text-align:center;gap:6px;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  h1{
    font-size:clamp(30px,7vw,50px);margin:6px 0;color:#2f7a3a;
    text-align:center;text-shadow:0 3px 0 #fff;
  }
  .sub{font-size:clamp(17px,4vw,22px);color:#4b5563;margin:0 0 18px;font-weight:700;}
  .step{
    font-size:clamp(22px,5vw,32px);text-align:center;color:#2f7a3a;
    text-shadow:0 3px 0 rgba(255,255,255,.8);margin:10px 0 0;
  }
  .title-emoji{font-size:clamp(70px,18vw,110px);line-height:1;animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-14px) rotate(3deg)}
  }

  .card{
    background:rgba(255,255,255,.94);
    border-radius:32px;
    padding:clamp(16px,4vw,30px);
    box-shadow:0 18px 45px rgba(0,0,0,.13);
    width:100%;
  }

  .art{font-size:clamp(70px,18vw,120px);line-height:1;text-align:center;animation:bob 3s ease-in-out infinite;}

  .story{
    font-size:clamp(19px,4.6vw,26px);line-height:1.55;font-weight:700;
    text-align:center;margin:14px 0 0;color:#2f3542;
  }
  .prefix{
    font-size:clamp(16px,3.9vw,21px);font-weight:800;color:#c26a00;
    background:#fff6e0;border:3px dashed #ffd93d;border-radius:20px;
    padding:12px 16px;margin:0 0 12px;text-align:center;
    animation:pop .35s ease both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

  .choices{display:grid;gap:14px;margin-top:22px;}
  .choice{
    --c:#ffd93d;
    display:flex;align-items:center;gap:14px;
    font-family:inherit;font-size:clamp(17px,4.2vw,22px);font-weight:900;color:#2f3542;
    background:#fff;border:4px solid var(--c);border-radius:24px;
    padding:14px 20px;cursor:pointer;
    box-shadow:0 6px 0 var(--c);
    transition:transform .12s, box-shadow .12s, background .15s;
    text-align:left;
  }
  .choice:nth-child(2n){--c:#7fd4ff;}
  .choice:nth-child(3n){--c:#a78bfa;}
  .choice:hover{background:#fffdf2;transform:translateY(-3px);box-shadow:0 9px 0 var(--c);}
  .choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c);}
  .choice .ce{font-size:clamp(34px,8vw,46px);line-height:1;}

  .btn{
    font-family:inherit;font-size:clamp(20px,4.6vw,26px);font-weight:900;color:#fff;
    background:linear-gradient(180deg,#7ed957,#42a54a);
    border:none;border-radius:999px;padding:18px 44px;cursor:pointer;
    box-shadow:0 8px 0 #2e7d34, 0 14px 24px rgba(0,0,0,.18);
    transition:transform .12s, box-shadow .12s;
    margin-top:10px;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 #2e7d34;}
  .btn.alt{background:linear-gradient(180deg,#ffb84d,#f39c12);box-shadow:0 8px 0 #c87f0a,0 14px 24px rgba(0,0,0,.18);}
  .btn.alt:active{box-shadow:0 2px 0 #c87f0a;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:18px 0;width:100%;}
  .pick{
    background:#fff;border:4px solid #fff;border-radius:28px;padding:16px 10px;cursor:pointer;
    font-family:inherit;box-shadow:0 8px 20px rgba(0,0,0,.1);
    transition:transform .15s, border-color .15s;
  }
  .pick:hover{transform:translateY(-5px) scale(1.03);border-color:#ffd93d;}
  .pick:active{transform:scale(.97);}
  .pick-emoji{display:block;font-size:clamp(48px,12vw,68px);line-height:1;}
  .pick-name{display:block;margin-top:10px;font-size:clamp(15px,3.6vw,18px);font-weight:900;color:#2f3542;}

  .preview-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0;}
  .hero-circle{
    width:clamp(130px,34vw,170px);height:clamp(130px,34vw,170px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(70px,18vw,96px);
    box-shadow:0 12px 28px rgba(0,0,0,.18), inset 0 -8px 0 rgba(0,0,0,.08);
    border:6px solid #fff;
    transition:background .3s;
    animation:bob 3s ease-in-out infinite;
  }
  .preview-name{font-size:clamp(18px,4.4vw,24px);font-weight:900;color:#2f3542;}

  .swatches{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px 0 20px;}
  .swatch{
    width:clamp(56px,14vw,72px);height:clamp(56px,14vw,72px);border-radius:50%;
    border:5px solid #fff;cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,.18);
    transition:transform .15s, outline-color .15s;
    outline:5px solid transparent;
  }
  .swatch:hover{transform:scale(1.1);}
  .swatch.sel{outline-color:#2f3542;transform:scale(1.1);}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;}
  .stars{font-size:clamp(22px,5.5vw,32px);letter-spacing:3px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));}
  .stars.big{font-size:clamp(34px,9vw,52px);text-align:center;margin:14px 0;}
  .tools{display:flex;gap:10px;}
  .icon-btn{
    width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.92);font-size:24px;
    box-shadow:0 5px 14px rgba(0,0,0,.15);
    transition:transform .12s;
  }
  .icon-btn:active{transform:scale(.9);}

  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;}

  .confetti{position:fixed;top:-20px;z-index:999;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{
    0%{transform:translateY(-10vh) rotate(0);opacity:1;}
    100%{transform:translateY(110vh) rotate(720deg);opacity:.85;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   СКАЗКА-ИГРА ДЛЯ ДЕТСКОГО САДА
   ============================================================ */

/* ---------- ЗВУКИ ---------- */
let actx = null;
function tone(freq, dur, type, vol){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
function sClick(){ tone(700,0.09,'triangle',0.08); setTimeout(()=>tone(950,0.11,'triangle',0.07),80); }
function sStar(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'sine',0.09), i*110)); }

/* ---------- РЕЧЬ ---------- */
let ruVoice = null, speakToken = 0;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  ruVoice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('ru')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!state.voice || !('speechSynthesis' in window)) return;
  const my = ++speakToken;
  speechSynthesis.cancel();
  setTimeout(()=>{
    if(my !== speakToken) return;
    const clean = String(text).replace(/[^\p{L}\p{N}\s,.:;!?—–-]/gu,' ').replace(/\s+/g,' ');
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'ru-RU';
    u.rate = 0.92;
    u.pitch = 1.15;
    if(ruVoice) u.voice = ruVoice;
    speechSynthesis.speak(u);
  }, 80);
}
function stopSpeak(){
  speakToken++;
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

/* ---------- ДАННЫЕ ---------- */
const ANIMALS = [
  {id:'bunny',    emoji:'🐰', title:'Зайчонок',    name:'Пушок'},
  {id:'fox',      emoji:'🦊', title:'Лисёнок',     name:'Рыжик'},
  {id:'bear',     emoji:'🐻', title:'Медвежонок',  name:'Миша'},
  {id:'hedgehog', emoji:'🦔', title:'Ёжик',        name:'Колючка'}
];

const COLORS = [
  {hex:'#FFD93D', name:'Солнечный'},
  {hex:'#7FD4FF', name:'Небесный'},
  {hex:'#9CE37D', name:'Луговой'},
  {hex:'#FF9BC2', name:'Ягодный'},
  {hex:'#C4A7FF', name:'Сиреневый'},
  {hex:'#FFB36B', name:'Апельсиновый'}
];

/* ---------- СКАЗКА ---------- */
const STORY = {
  intro: {
    bg:'linear-gradient(160deg,#c8f7c5,#e8f7e4)',
    art:'🌳',
    text: h => `В волшебном лесу жил-был ${h.title} по имени ${h.name}. Однажды утром он вышел погулять и вдруг услышал: кто-то плачет.`,
    choices:[
      {emoji:'🐰', label:'Бежать на полянку',  result: h=>`${h.name} побежал по мягкой травке — топ-топ-топ!`, next:'bunny'},
      {emoji:'🌲', label:'Идти по тропинке',   result: h=>`${h.name} пошёл по лесной тропинке — шаг-шаг!`,     next:'bunny'}
    ]
  },

  bunny: {
    bg:'linear-gradient(160deg,#ffeaa7,#dff9fb)',
    art:'🐰',
    text: () => `На полянке сидел маленький зайчик и горько плакал. «Я потерял свою морковку!» — всхлипнул он.`,
    choices:[
      {emoji:'🔍',  label:'Поискать под кустом', result: h=>`${h.name} заглянул под куст...`,                       next:'bunny_ok'},
      {emoji:'🐿️', label:'Спросить у белочки',   result: () =>`Белочка подсказала: «Я видела морковку под кустом!»`, next:'bunny_ok'}
    ]
  },

  bunny_ok: {
    star:true,
    bg:'linear-gradient(160deg,#ffeaa7,#b8e994)',
    art:'🥕',
    text: h => `Ура! Морковка нашлась! Зайчик обрадовался и подарил ${h.name} волшебный лучик. ⭐`,
    choices:[{emoji:'➡️', label:'Идти дальше', next:'river'}]
  },

  river: {
    bg:'linear-gradient(160deg,#a8e6ff,#dff9fb)',
    art:'🌊',
    text: () => `Впереди — быстрая речка. Мостик сломан! А на другом берегу кто-то грустит.`,
    choices:[
      {emoji:'🪵', label:'Построить мостик',    result: h=>`${h.name} принёс брёвнышки: тук-тук-тук! Мостик готов!`, next:'river_ok'},
      {emoji:'🍃', label:'Поплыть на листике',  result: h=>`${h.name} прыгнул на большой листик — и поплыл: вжжух!`,  next:'river_ok'}
    ]
  },

  river_ok: {
    star:true,
    bg:'linear-gradient(160deg,#a8e6ff,#c8f7c5)',
    art:'🐿️',
    text: h => `На берегу белочка не могла достать орешки. ${h.name} помог ей — и белочка подарила второй волшебный лучик! ⭐`,
    choices:[{emoji:'➡️', label:'Идти дальше', next:'cloud'}]
  },

  cloud: {
    bg:'linear-gradient(160deg,#b2bec3,#dfe6e9)',
    art:'☁️',
    text: () => `Вдруг стало темно: тучка закрыла солнышко! В лесу сразу стало грустно и холодно.`,
    choices:[
      {emoji:'🌬️', label:'Позвать ветер',    result: h=>`${h.name} дунул изо всех сил: «Фу-у-у!» Ветер прилетел и подхватил тучку!`, next:'final'},
      {emoji:'🎵', label:'Спеть песенку',    result: h=>`${h.name} спел весёлую песенку: «Ля-ля-ля!» Тучке стало весело, и она улетела!`, next:'final'}
    ]
  },

  final: {
    star:true,
    bg:'linear-gradient(160deg,#ffeaa7,#ffd93d)',
    art:'☀️',
    text: h => `Солнышко засияло! Весь лес заулыбался и закричал: «Спасибо тебе, ${h.name}!» Ты собрал все три волшебных лучика!`,
    choices:[{emoji:'🎉', label:'Ура!', end:true}]
  }
};

/* ---------- СОСТОЯНИЕ ---------- */
const state = {
  animal: null,
  color: COLORS[0],
  stars: 0,
  starScenes: new Set(),
  voice: true,
  sceneId: null,
  prefix: '',
  lastSpeech: ''
};

const app = document.getElementById('app');
function getHero(){
  return {
    emoji: state.animal.emoji,
    title: state.animal.title,
    name:  state.animal.name,
    color: state.color.hex
  };
}

/* ---------- ЭКРАН: ЗАСТАВКА ---------- */
function showTitle(){
  stopSpeak();
  state.stars = 0;
  state.starScenes = new Set();
  state.animal = null;
  state.color = COLORS[0];
  state.prefix = '';
  document.body.style.background = 'linear-gradient(160deg,#d9f7c5,#a8e6cf)';
  app.innerHTML = `
    <div class="screen center">
      <div class="title-emoji">🌈</div>
      <h1>Сказка-игра</h1>
      <p class="sub">Создай своего героя —<br>и отправляйся в волшебный лес!</p>
      <button class="btn" id="btnStart">▶ Начать</button>
    </div>`;
  document.getElementById('btnStart').onclick = () => { sClick(); showAnimals(); };
}

/* ---------- ЭКРАН: ВЫБОР ЗВЕРЬКА ---------- */
function showAnimals(){
  stopSpeak();
  document.body.style.background = 'linear-gradient(160deg,#ffeaa7,#a8e6cf)';
  app.innerHTML = `
    <div class="screen">
      <h2 class="step">1. Выбери героя</h2>
      <div class="grid">
        ${ANIMALS.map(a => `
          <button class="pick" data-id="${a.id}">
            <span class="pick-emoji">${a.emoji}</span>
            <span class="pick-name">${a.title}<br>${a.name}</span>
          </button>`).join('')}
      </div>
    </div>`;
  app.querySelectorAll('.pick').forEach(b => {
    b.onclick = () => {
      sClick();
      state.animal = ANIMALS.find(a => a.id === b.dataset.id);
      speak(`${state.animal.title} ${state.animal.name}`);
      setTimeout(showColors, 250);
    };
  });
  speak('Шаг первый. Выбери героя сказки.');
}

/* ---------- ЭКРАН: ВЫБОР ЦВЕТА ---------- */
function showColors(){
  stopSpeak();
  document.body.style.background = 'linear-gradient(160deg,#ffd6e8,#c4a7ff)';
  app.innerHTML = `
    <div class="screen">
      <h2 class="step">2. Выбери цвет героя</h2>
      <div class="preview-wrap">
        <div class="hero-circle" id="preview" style="background:${state.color.hex}">${state.animal.emoji}</div>
        <div class="preview-name">${state.animal.title} ${state.animal.name}</div>
      </div>
      <div class="swatches">
        ${COLORS.map(c => `<button class="swatch ${c.hex === state.color.hex ? 'sel' : ''}"
            data-hex="${c.hex}" style="background:${c.hex}" title="${c.name}"></button>`).join('')}
      </div>
      <div style="text-align:center">
        <button class="btn" id="btnGo">В сказку! ✨</button>
      </div>
    </div>`;

  const preview = document.getElementById('preview');
  app.querySelectorAll('.swatch').forEach(s => {
    s.onclick = () => {
      tone(500 + Math.random()*400, 0.1, 'sine', 0.06);
      state.color = COLORS.find(c => c.hex === s.dataset.hex);
      preview.style.background = state.color.hex;
      app.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
      s.classList.add('sel');
    };
  });
  document.getElementById('btnGo').onclick = () => {
    sClick();
    showScene('intro');
  };
  speak('Шаг второй. Выбери цвет героя.');
}

/* ---------- ЭКРАН: СЦЕНА СКАЗКИ ---------- */
function showScene(id){
  stopSpeak();
  const sc = STORY[id];
  state.sceneId = id;
  const h = getHero();
  document.body.style.background = sc.bg;

  if(sc.star && !state.starScenes.has(id)){
    state.starScenes.add(id);
    state.stars = Math.min(3, state.stars + 1);
    setTimeout(sStar, 400);
  }

  const prefix = state.prefix;
  state.prefix = '';
  const text = sc.text(h);
  state.lastSpeech = (prefix ? prefix + ' ' : '') + text;

  app.innerHTML = `
    <div class="screen">
      <div class="topbar">
        <div class="stars">${'⭐'.repeat(state.stars)}${'☆'.repeat(Math.max(0, 3 - state.stars))}</div>
        <div class="tools">
          <button class="icon-btn" id="btnRepeat" title="Повторить">🔁</button>
          <button class="icon-btn" id="btnVoice" title="Звук">${state.voice ? '🔊' : '🔇'}</button>
        </div>
      </div>
      <div class="card">
        <div class="art">${sc.art}</div>
        ${prefix ? `<p class="prefix">${prefix}</p>` : ''}
        <p class="story">${text}</p>
        <div class="choices">
          ${sc.choices.map((c, i) => `
            <button class="choice" data-i="${i}">
              <span class="ce">${c.emoji}</span><span>${c.label}</span>
            </button>`).join('')}
        </div>
      </div>
    </div>`;

  app.querySelectorAll('.choice').forEach(b => {
    b.onclick = () => pickChoice(parseInt(b.dataset.i, 10));
  });
  document.getElementById('btnRepeat').onclick = () => { sClick(); speak(state.lastSpeech); };
  document.getElementById('btnVoice').onclick = (e) => {
    state.voice = !state.voice;
    e.currentTarget.textContent = state.voice ? '🔊' : '🔇';
    if(state.voice) speak(state.lastSpeech); else stopSpeak();
  };

  speak(state.lastSpeech);
}

/* ---------- ВЫБОР РЕБЁНКА ---------- */
function pickChoice(i){
  const sc = STORY[state.sceneId];
  const c = sc.choices[i];
  sClick();
  if(c.result) state.prefix = c.result(getHero());
  if(c.next) showScene(c.next);
  else if(c.end) showEnd();
}

/* ---------- ФИНАЛ ---------- */
function showEnd(){
  stopSpeak();
  document.body.style.background = 'linear-gradient(160deg,#ffeaa7,#ffb347)';
  const h = getHero();
  confetti();
  setTimeout(sStar, 350);

  app.innerHTML = `
    <div class="screen center">
      <div class="title-emoji">☀️</div>
      <h1>Сказка закончилась!</h1>
      <div class="card">
        <p class="story">
          ${h.emoji} ${h.title} ${h.name} собрал все волшебные лучики<br>
          и спас солнышко! Весь лес говорит: «Спасибо!» 🌟
        </p>
        <div class="stars big">⭐⭐⭐</div>
        <div class="row">
          <button class="btn" id="btnAgain">🔁 Ещё раз</button>
          <button class="btn alt" id="btnNew">🎨 Новый герой</button>
        </div>
      </div>
    </div>`;

  document.getElementById('btnAgain').onclick = () => {
    sClick();
    state.stars = 0;
    state.starScenes = new Set();
    state.prefix = '';
    showScene('intro');
  };
  document.getElementById('btnNew').onclick = () => { sClick(); showAnimals(); };

  speak(`${h.name} собрал все волшебные лучики и спас солнышко! Молодец! Сказка закончилась.`);
}

/* ---------- КОНФЕТТИ ---------- */
function confetti(){
  const colors = ['#FFD93D','#FF6B6B','#4ECDC4','#A78BFA','#FF9BC2','#9CE37D','#FFB36B'];
  for(let i = 0; i < 70; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.width = (8 + Math.random() * 10) + 'px';
    c.style.height = (8 + Math.random() * 10) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    c.style.animationDelay = (Math.random() * 1.2) + 's';
    c.style.animationDuration = (2.2 + Math.random() * 2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}

/* ---------- СТАРТ ---------- */
showTitle();
</script>
</body>
</html>
