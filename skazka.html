<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Герои сказок — 3D игра для малышей</title>
<style>
/* ============================================================
   ОБЩИЕ СТИЛИ И 3D-СЦЕНА
   ============================================================ */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: 'Comic Sans MS', 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #ffdde1, #c2e9fb, #fff3b0, #d5f5e3, #e8d5ff);
  background-size: 400% 400%;
  animation: bgMove 22s ease infinite;
  min-height: 100vh;
  overflow-x: hidden;
  color: #3b2b4a;
  /* Перспектива для всей страницы — даёт эффект «сцены» */
  perspective: 1600px;
  perspective-origin: 50% 30%;
}

@keyframes bgMove {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ---------- Фоновые украшения с 3D-глубиной ---------- */
#bg-decor {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
  transform-style: preserve-3d;
  perspective: 900px;
}
.decor {
  position: absolute;
  font-size: 42px;
  opacity: 0.35;
  animation: floatUp linear infinite;
  transform-style: preserve-3d;
  will-change: transform;
}
@keyframes floatUp {
  0% {
    transform: translateY(20vh) translateZ(-200px) rotateX(0deg) rotateY(0deg);
    opacity: 0;
  }
  10% { opacity: 0.45; }
  50% { transform: translateY(-40vh) translateZ(60px) rotateX(180deg) rotateY(180deg); }
  90% { opacity: 0.45; }
  100% {
    transform: translateY(-120vh) translateZ(-150px) rotateX(360deg) rotateY(720deg);
    opacity: 0;
  }
}

/* ---------- Экраны ---------- */
.screen {
  display: none;
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding: 16px;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  transform-style: preserve-3d;
}
.screen.active {
  display: flex;
  animation: screenIn3D 0.55s cubic-bezier(0.34, 1.2, 0.64, 1);
}
.screen.has-hud { padding-top: 100px; }

@keyframes screenIn3D {
  0% {
    opacity: 0;
    transform: translateZ(-400px) rotateX(15deg) translateY(30px);
  }
  100% {
    opacity: 1;
    transform: translateZ(0) rotateX(0deg) translateY(0);
  }
}

/* ============================================================
   ВЕРХНЯЯ ПАНЕЛЬ (HUD)
   ============================================================ */
.hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 4px solid rgba(255, 255, 255, 0.95);
  box-shadow: 0 6px 24px rgba(120, 90, 180, 0.18);
  transition: transform 0.35s ease, opacity 0.35s ease;
  transform-style: preserve-3d;
}
.hud.hidden {
  transform: translateY(-140%) rotateX(45deg);
  opacity: 0;
  pointer-events: none;
}
.hud-title {
  font-size: 22px;
  font-weight: bold;
  color: #7b5ea7;
  flex: 1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  width: 60px;
  height: 60px;
  min-width: 60px;
  border-radius: 18px;
  border: 3px solid #fff;
  background: linear-gradient(180deg, #ffd93d, #ffb52e);
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 5px 0 #d99400, 0 12px 20px rgba(217, 148, 0, 0.28);
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  transform-style: preserve-3d;
}
.icon-btn:hover { transform: translateY(-3px) rotateX(8deg); }
.icon-btn:active {
  transform: translateY(5px) translateZ(-20px);
  box-shadow: 0 0 0 #d99400;
}
.hud-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hud-stars {
  background: linear-gradient(180deg, #fff7cf, #ffe680);
  border: 3px solid #fff;
  border-radius: 16px;
  padding: 8px 14px;
  font-size: 22px;
  font-weight: bold;
  color: #8a6400;
  box-shadow: 0 4px 0 #e0b800, inset 0 -3px 8px rgba(0,0,0,0.08);
  white-space: nowrap;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.hud-stars.pump {
  animation: starPump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes starPump {
  0%   { transform: scale(1) rotate(0deg); }
  40%  { transform: scale(1.35) rotate(-8deg); }
  70%  { transform: scale(1.15) rotate(6deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.hud-progress {
  background: linear-gradient(180deg, #d6ecff, #a9d6ff);
  border: 3px solid #fff;
  border-radius: 16px;
  padding: 8px 14px;
  font-size: 20px;
  font-weight: bold;
  color: #20527f;
  box-shadow: 0 4px 0 #7fb6e8;
  white-space: nowrap;
}

/* ============================================================
   ГЛАВНОЕ МЕНЮ
   ============================================================ */
#screen-menu {
  justify-content: center;
  text-align: center;
}
.title {
  font-size: clamp(34px, 8vw, 62px);
  margin: 0 0 6px;
  color: #fff;
  text-shadow:
    0 4px 0 #b57edc,
    0 8px 0 #8e5fc0,
    0 12px 22px rgba(90, 50, 140, 0.4);
  letter-spacing: 1px;
  animation: titleFloat3D 3s ease-in-out infinite;
  transform-style: preserve-3d;
}
@keyframes titleFloat3D {
  0%, 100% {
    transform: translateY(0) rotateX(-6deg) rotateY(-3deg);
  }
  50% {
    transform: translateY(-14px) rotateX(6deg) rotateY(3deg);
  }
}
.subtitle {
  font-size: clamp(18px, 4vw, 26px);
  color: #6b4f96;
  margin: 0 0 28px;
  font-weight: bold;
}
.menu-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  justify-content: center;
  align-items: stretch;
  perspective: 1200px;
  transform-style: preserve-3d;
}

/* Кнопка меню — с 3D-наклоном и «вдавливанием» */
.menu-btn {
  perspective: 900px;
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  font-family: inherit;
  transform-style: preserve-3d;
}
.menu-btn-face {
  width: 210px;
  height: 210px;
  border-radius: 34px;
  border: 5px solid #fff;
  font-size: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #fff;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.25s cubic-bezier(0.34, 1.3, 0.64, 1);
  transform:
    rotateX(var(--rx, 0deg))
    rotateY(var(--ry, 0deg))
    translateZ(var(--tz, 0px))
    scale(var(--sc, 1));
  will-change: transform;
}
/* Блик, который следует за пальцем/мышкой */
.menu-btn-face::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(
    circle at var(--mx, 50%) var(--my, 30%),
    rgba(255, 255, 255, 0.65),
    rgba(255, 255, 255, 0) 55%
  );
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
}
.menu-btn:hover .menu-btn-face::before { opacity: 1; }
.menu-btn:active .menu-btn-face {
  --tz: -30px;
  --sc: 0.94;
  transition: transform 0.08s ease-out;
}
.menu-btn-face > .menu-emoji {
  display: block;
  line-height: 1;
  transform: translateZ(30px);
  filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25));
}
.menu-btn-face > .menu-label {
  font-size: 22px;
  font-weight: bold;
  padding: 0 10px;
  text-align: center;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  transform: translateZ(15px);
  line-height: 1.15;
}
.menu-btn:nth-child(1) .menu-btn-face {
  background: linear-gradient(180deg, #ff9a9e, #ff6b81);
  box-shadow: 0 10px 0 #d63f57, 0 18px 36px rgba(214, 63, 87, 0.42);
}
.menu-btn:nth-child(2) .menu-btn-face {
  background: linear-gradient(180deg, #7ed6ff, #3fa9f5);
  box-shadow: 0 10px 0 #1c7cc4, 0 18px 36px rgba(28, 124, 196, 0.42);
}
.menu-btn:nth-child(3) .menu-btn-face {
  background: linear-gradient(180deg, #a8e063, #56ab2f);
  box-shadow: 0 10px 0 #3c7d1e, 0 18px 36px rgba(60, 125, 30, 0.42);
}
.best-box {
  margin-top: 32px;
  background: rgba(255, 255, 255, 0.9);
  border: 4px solid #fff;
  border-radius: 24px;
  padding: 14px 26px;
  font-size: 22px;
  font-weight: bold;
  color: #7b5ea7;
  box-shadow: 0 8px 24px rgba(120, 90, 180, 0.22);
  animation: bestFloat 4s ease-in-out infinite;
}
@keyframes bestFloat {
  0%, 100% { transform: translateY(0) rotateY(-3deg); }
  50%      { transform: translateY(-6px) rotateY(3deg); }
}

/* ============================================================
   ИГРОВАЯ КАРТОЧКА
   ============================================================ */
.game-card {
  width: 100%;
  max-width: 860px;
  background: rgba(255, 255, 255, 0.92);
  border: 6px solid #fff;
  border-radius: 34px;
  padding: 22px 20px 28px;
  box-shadow:
    0 14px 40px rgba(120, 90, 180, 0.25),
    inset 0 -6px 0 rgba(120, 90, 180, 0.05);
  text-align: center;
  transform-style: preserve-3d;
  animation: cardEnter 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
}
@keyframes cardEnter {
  0% { opacity: 0; transform: translateZ(-200px) rotateX(20deg); }
  100% { opacity: 1; transform: translateZ(0) rotateX(0); }
}
.game-title {
  font-size: clamp(24px, 5vw, 34px);
  margin: 0 0 6px;
  color: #7b5ea7;
}
.question-text {
  font-size: clamp(20px, 4vw, 26px);
  color: #6b4f96;
  margin: 0 0 8px;
  font-weight: bold;
}
.feedback {
  min-height: 40px;
  font-size: clamp(22px, 4.5vw, 30px);
  font-weight: bold;
  margin-top: 10px;
  transition: opacity 0.2s;
}
.feedback.good { color: #2e9e46; }
.feedback.bad  { color: #e0623f; }

/* ============================================================
   ИГРА 1 — УГАДАЙ ГЕРОЯ (3D-сцена)
   ============================================================ */
.hero-3d-scene {
  perspective: 1100px;
  perspective-origin: 50% 60%;
  transform-style: preserve-3d;
  margin: 20px auto 6px;
  display: inline-block;
}
.hero-tilt {
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  transform:
    rotateX(var(--hx, 0deg))
    rotateY(var(--hy, 0deg));
  will-change: transform;
}
.hero-float {
  animation: heroFloat 3.4s ease-in-out infinite;
  transform-style: preserve-3d;
  display: inline-block;
}
@keyframes heroFloat {
  0%, 100% {
    transform: translateY(0) rotateZ(-2deg);
  }
  50% {
    transform: translateY(-16px) rotateZ(2deg);
  }
}
.hero-display {
  font-size: clamp(96px, 24vw, 160px);
  line-height: 1.05;
  filter: drop-shadow(0 16px 20px rgba(90, 50, 140, 0.35));
  display: inline-block;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-style: preserve-3d;
}
.hero-display.pop {
  animation: popIn3D 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn3D {
  0% {
    transform: scale(0.2) translateZ(-400px) rotateX(60deg) rotateY(-40deg);
    opacity: 0;
  }
  60% {
    transform: scale(1.2) translateZ(60px) rotateX(-15deg) rotateY(20deg);
    opacity: 1;
  }
  100% {
    transform: scale(1) translateZ(0) rotateX(0) rotateY(0);
    opacity: 1;
  }
}
.hero-display.spin3d {
  animation: spin3D 1.1s cubic-bezier(0.34, 1.2, 0.64, 1);
}
@keyframes spin3D {
  0%   { transform: rotateY(0deg) rotateX(0) scale(1); }
  50%  { transform: rotateY(540deg) rotateX(20deg) scale(1.25); }
  100% { transform: rotateY(1080deg) rotateX(0) scale(1); }
}
.hero-display.tada {
  animation: tada3D 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes tada3D {
  0%, 100% { transform: scale(1) rotate(0deg) rotateY(0); }
  15% { transform: scale(0.9) rotate(-8deg) rotateY(-20deg); }
  30% { transform: scale(1.15) rotate(8deg) rotateY(20deg); }
  45% { transform: scale(0.95) rotate(-6deg) rotateY(-15deg); }
  60% { transform: scale(1.08) rotate(6deg) rotateY(15deg); }
  75% { transform: scale(0.98) rotate(-3deg) rotateY(-8deg); }
}

.options {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  margin-top: 24px;
  perspective: 900px;
}
.option-btn {
  min-width: 170px;
  min-height: 84px;
  padding: 14px 26px;
  font-size: clamp(22px, 4.5vw, 28px);
  font-family: inherit;
  font-weight: bold;
  border-radius: 24px;
  border: 4px solid #fff;
  background: linear-gradient(180deg, #ffffff, #eef4ff);
  color: #3b2b4a;
  cursor: pointer;
  box-shadow:
    0 7px 0 rgba(120, 90, 180, 0.28),
    0 12px 24px rgba(120, 90, 180, 0.14);
  transition:
    transform 0.2s cubic-bezier(0.34, 1.3, 0.64, 1),
    box-shadow 0.2s,
    background 0.25s,
    color 0.25s;
  transform-style: preserve-3d;
  will-change: transform;
}
.option-btn:hover {
  transform: translateY(-4px) translateZ(20px) rotateX(-4deg);
  box-shadow:
    0 11px 0 rgba(120, 90, 180, 0.28),
    0 18px 32px rgba(120, 90, 180, 0.22);
}
.option-btn:active {
  transform: translateY(6px) translateZ(-15px) rotateX(6deg);
  box-shadow: 0 1px 0 rgba(120, 90, 180, 0.28);
}
.option-btn.correct {
  background: linear-gradient(180deg, #8ee89b, #4cc764);
  color: #fff;
  border-color: #fff;
  animation: correct3D 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow:
    0 7px 0 #349a4a,
    0 12px 30px rgba(76, 199, 100, 0.5);
}
@keyframes correct3D {
  0%   { transform: scale(1) rotateY(0); }
  30%  { transform: scale(1.18) rotateY(20deg) translateZ(40px); }
  60%  { transform: scale(0.98) rotateY(-15deg); }
  100% { transform: scale(1) rotateY(0) translateZ(0); }
}
.option-btn.wrong {
  background: linear-gradient(180deg, #ffc9c9, #ff9d9d);
  color: #a33;
  opacity: 0.6;
}
.shake {
  animation: shake3D 0.55s ease;
}
@keyframes shake3D {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  15%      { transform: translateX(-10px) rotate(-4deg) rotateY(-8deg); }
  30%      { transform: translateX(10px) rotate(4deg) rotateY(8deg); }
  45%      { transform: translateX(-8px) rotate(-3deg) rotateY(-6deg); }
  60%      { transform: translateX(8px) rotate(3deg) rotateY(6deg); }
  80%      { transform: translateX(-4px) rotate(-1deg); }
}

/* ============================================================
   ИГРА 2 — НАЙДИ ПАРУ (3D МЕМОРИ)
   ============================================================ */
.memory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 18px;
  width: 100%;
  perspective: 1400px;
  transform-style: preserve-3d;
}
.mem-card {
  perspective: 1000px;
  aspect-ratio: 1 / 1;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  transform-style: preserve-3d;
  transition: transform 0.3s cubic-bezier(0.34, 1.3, 0.64, 1);
}
.mem-card:hover {
  transform: translateY(-6px);
  z-index: 5;
}
.mem-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
}
.mem-card.flipped .mem-inner,
.mem-card.matched .mem-inner {
  transform: rotateY(180deg) translateZ(20px);
}
.mem-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 22px;
  font-size: clamp(40px, 9.5vw, 64px);
  line-height: 1;
  transform-style: preserve-3d;
}
.mem-back {
  background: linear-gradient(150deg, #8ecbff, #3fa9f5);
  color: #fff;
  border: 4px solid #fff;
  box-shadow:
    inset 0 -6px 0 rgba(0, 0, 0, 0.18),
    0 8px 0 #1c7cc4,
    0 14px 26px rgba(28, 124, 196, 0.32);
  font-size: clamp(34px, 8vw, 52px);
}
.mem-card:hover .mem-back {
  box-shadow:
    inset 0 -6px 0 rgba(0, 0, 0, 0.18),
    0 10px 0 #1c7cc4,
    0 22px 40px rgba(28, 124, 196, 0.45);
}
.mem-front {
  background: linear-gradient(180deg, #ffffff, #fff8e0);
  border: 4px solid #ffd93d;
  transform: rotateY(180deg) translateZ(0.1px);
  box-shadow:
    0 8px 0 #e0b800,
    0 14px 26px rgba(224, 184, 0, 0.28);
}
.mem-card.matched .mem-front {
  border-color: #6bcb77;
  background: linear-gradient(180deg, #ffffff, #e2ffe9);
  box-shadow:
    0 8px 0 #3fa04f,
    0 14px 32px rgba(107, 203, 119, 0.4);
}
.mem-card.matched {
  animation: match3D 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes match3D {
  0%   { transform: scale(1) translateY(0); }
  40%  { transform: scale(1.18) translateY(-12px) translateZ(60px); }
  70%  { transform: scale(1.05) translateY(-4px); }
  100% { transform: scale(1) translateY(0) translateZ(0); }
}
.mem-card.matched .mem-front::after {
  content: '✅';
  position: absolute;
  bottom: 4px;
  right: 6px;
  font-size: 20px;
}

/* ============================================================
   ИГРА 3 — СОБЕРИ СКАЗКУ (3D)
   ============================================================ */
.slots {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin: 20px 0 6px;
  perspective: 1200px;
  transform-style: preserve-3d;
}
.slot {
  width: 96px;
  height: 96px;
  border-radius: 22px;
  border: 4px dashed #c0a9e6;
  background: rgba(255, 255, 255, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-size: 46px;
  line-height: 1;
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
  transform-style: preserve-3d;
  box-shadow: 0 8px 20px rgba(120, 90, 180, 0.1);
}
.slot .slot-num {
  position: absolute;
  top: -12px;
  left: -8px;
  background: #ffd93d;
  color: #7a5b00;
  font-size: 15px;
  font-weight: bold;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
  transform: translateZ(30px);
}
.slot.filled {
  border-style: solid;
  border-color: #6bcb77;
  background: linear-gradient(180deg, #ffffff, #e2ffe9);
  box-shadow: 0 8px 0 #3fa04f, 0 16px 30px rgba(107, 203, 119, 0.35);
  transform: translateZ(15px);
}
.slot.filled .pool-emoji {
  animation: dropIn3D 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: inline-block;
  transform-style: preserve-3d;
}
@keyframes dropIn3D {
  0% {
    transform: translateY(-140px) translateZ(200px) rotateX(-90deg) scale(0.6);
    opacity: 0;
  }
  65% {
    transform: translateY(8px) translateZ(20px) rotateX(15deg) scale(1.1);
    opacity: 1;
  }
  100% {
    transform: translateY(0) translateZ(0) rotateX(0) scale(1);
    opacity: 1;
  }
}
.pool {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  margin-top: 22px;
  padding-top: 20px;
  border-top: 4px dotted #d9cbf0;
  perspective: 1000px;
  transform-style: preserve-3d;
}
.pool-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

<script>
/* ============================================================
   БЛОК 1. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ============================================================ */

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ============================================================
   БЛОК 2. ЗВУК (Web Audio API)
   ============================================================ */

let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    } catch (e) { audioCtx = null; }
  }
  return audioCtx;
}

function playTone(freq, duration, type, delay, volume) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  type = type || 'sine';
  delay = delay || 0;
  volume = volume === undefined ? 0.16 : volume;

  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);

  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(volume, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.05);
}

function soundCorrect() {
  playTone(660, 0.13, 'sine', 0, 0.18);
  playTone(880, 0.15, 'sine', 0.11, 0.18);
  playTone(1320, 0.24, 'sine', 0.23, 0.16);
}

function soundWrong() {
  playTone(300, 0.16, 'sine', 0, 0.14);
  playTone(200, 0.24, 'sine', 0.14, 0.13);
}

function soundClick() { playTone(540, 0.07, 'triangle', 0, 0.09); }
function soundFlip() {
  playTone(480, 0.08, 'triangle', 0, 0.09);
  playTone(640, 0.07, 'triangle', 0.06, 0.07);
}

function soundWin() {
  const notes = [523, 659, 784, 1047, 784, 1047, 1319];
  notes.forEach((n, i) => playTone(n, 0.22, 'sine', i * 0.14, 0.16));
}

/* ============================================================
   БЛОК 3. РЕЧЬ (SpeechSynthesis API)
   ============================================================ */

let lastSpeakTime = 0;

function speak(text, force) {
  if (!('speechSynthesis' in window) || !text) return;
  const now = Date.now();
  if (!force && now - lastSpeakTime < 300) return;
  lastSpeakTime = now;

  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ru-RU';
    utter.rate = 0.92;
    utter.pitch = 1.15;
    utter.volume = 1;

    const voices = window.speechSynthesis.getVoices();
    if (voices && voices.length) {
      const ru = voices.find(v => v.lang && v.lang.toLowerCase().indexOf('ru') === 0);
      if (ru) utter.voice = ru;
    }
    window.speechSynthesis.speak(utter);
  } catch (e) { /* молчим */ }
}

function stopSpeak() {
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = function () {
    try { window.speechSynthesis.getVoices(); } catch (e) {}
  };
}

/* ============================================================
   БЛОК 4. ВИЗУАЛЬНЫЕ ЭФФЕКТЫ
   ============================================================ */

function flash(color) {
  const el = document.getElementById('flash');
  el.className = color;
  void el.offsetWidth;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 450);
}

/** 3D-конфетти с вращением по всем осям */
function confetti(count) {
  count = count || 36;
  const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF',
                  '#FF8FAB', '#B983FF', '#FFA45B', '#4DD0E1'];
  const layer = document.getElementById('confetti-layer');

  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 8 + Math.random() * 12;

    piece.style.left = (Math.random() * 100) + 'vw';
    piece.style.width = size + 'px';
    piece.style.height = (size * (0.6 + Math.random() * 0.8)) + 'px';
    piece.style.background = pickRandom(colors);
    piece.style.animationDuration = (1.7 + Math.random() * 1.6) + 's';
    piece.style.animationDelay = (Math.random() * 0.3) + 's';
    // Разная глубина по Z — усиливает 3D-ощущение
    piece.style.setProperty('--tz', (Math.random() * 400 - 200) + 'px');
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';

    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 3600);
  }
}

function showFeedback(elementId, text, isGood) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.textContent = text;
  el.className = 'feedback ' + (isGood ? 'good' : 'bad');
}

/* ============================================================
   БЛОК 5. ФОНОВЫЕ УКРАШЕНИЯ С 3D-ГЛУБИНОЙ
   ============================================================ */

(function createBackgroundDecor() {
  const container = document.getElementById('bg-decor');
  const emojis = ['⭐', '🌈', '☁️', '🎈', '🌸', '✨', '🍭', '🌼', '🦋', '💫'];

  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div');
    el.className = 'decor';
    el.textContent = pickRandom(emojis);
    el.style.left = (Math.random() * 96) + 'vw';
    el.style.fontSize = (26 + Math.random() * 36) + 'px';
    el.style.animationDuration = (16 + Math.random() * 20) + 's';
    el.style.animationDelay = (-Math.random() * 22) + 's';
    container.appendChild(el);
  }
})();

/* ============================================================
   БЛОК 6. УПРАВЛЕНИЕ ЭКРАНАМИ И СЧЁТОМ
   ============================================================ */

const hud = document.getElementById('hud');
const hudTitle = document.getElementById('hud-title');
const hudStars = document.getElementById('hud-stars');
const hudProgress = document.getElementById('hud-progress');

let currentStars = 0;
let lastGame = 1;

function showScreen(screenId, withHud, title) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const screen = document.getElementById(screenId);
  if (screen) screen.classList.add('active');

  if (withHud) {
    hud.classList.remove('hidden');
    hudTitle.textContent = title || 'Герои сказок';
  } else {
    hud.classList.add('hidden');
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateHudStars() {
  hudStars.textContent = '⭐ ' + currentStars;
  hudStars.classList.remove('pump');
  void hudStars.offsetWidth;
  hudStars.classList.add('pump');
}

function updateHudProgress(text) { hudProgress.textContent = text; }

function getBest(gameNumber) {
  try {
    return parseInt(localStorage.getItem('skazki_best_' + gameNumber) || '0', 10) || 0;
  } catch (e) { return 0; }
}

function setBest(gameNumber, value) {
  try {
    if (value > getBest(gameNumber)) {
      localStorage.setItem('skazki_best_' + gameNumber, String(value));
    }
  } catch (e) {}
}

function getTotalBest() { return getBest(1) + getBest(2) + getBest(3); }

function updateBestDisplay() {
  const el = document.getElementById('best-score');
  if (el) el.textContent = getTotalBest();
}

/* ============================================================
   БЛОК 6.5. СИСТЕМА 3D-НАКЛОНА
   Универсальный помощник: элемент наклоняется за указателем.
   ============================================================ */

/**
 * Подключить 3D-наклон к элементу.
 * @param {HTMLElement} el — элемент, который наклоняем
 * @param {number} maxDeg — максимальный угол наклона в градусах
 * @param {number} liftZ — насколько «приподнять» элемент по Z
 * @param {boolean} shine — включать ли блик, следящий за указателем
 */
function attach3DTilt(el, maxDeg, liftZ, shine) {
  if (!el || el.dataset.tiltAttached) return;
  el.dataset.tiltAttached = '1';
  maxDeg = maxDeg || 12;
  liftZ = liftZ || 20;
  shine = shine !== false;

  let rafId = null;
  let lastEvt = null;

  const update = () => {
    if (!lastEvt) { rafId = null; return; }
    const e = lastEvt;
    const r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) { rafId = null; return; }
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const ry = (px - 0.5) * maxDeg * 2;
    const rx = (0.5 - py) * maxDeg * 2;

    el.style.transform =
      'perspective(700px) ' +
      'rotateX(' + rx.toFixed(2) + 'deg) ' +
      'rotateY(' + ry.toFixed(2) + 'deg) ' +
      'translateZ(' + liftZ + 'px)';

    if (shine) {
      el.style.setProperty('--mx', (px * 100) + '%');
      el.style.setProperty('--my', (py * 100) + '%');
    }
    rafId = null;
  };

  el.addEventListener('pointermove', e => {
    // На тач-устройствах реагируем только когда палец реально нажат
    if (e.pointerType === 'touch' && e.buttons === 0) return;
    lastEvt = e;
    if (!rafId) rafId = requestAnimationFrame(update);
  }, { passive: true });

  el.addEventListener('pointerleave', () => {
    lastEvt = null;
    el.style.transform = '';
  });

  el.addEventListener('pointercancel', () => {
    lastEvt = null;
    el.style.transform = '';
  });
}

/** Подключить 3D-наклон ко всем элементам с классом .menu-btn-face */
function initMenuTilt() {
  document.querySelectorAll('.menu-btn').forEach(btn => {
    const face = btn.querySelector('.menu-btn-face');
    if (!face || btn.dataset.menuTilted) return;
    btn.dataset.menuTilted = '1';

    let rafId = null;
    let lastEvt = null;

    const update = () => {
      if (!lastEvt) { rafId = null; return; }
      const e = lastEvt;
      const r = btn.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const ry = (px - 0.5) * 32;
      const rx = (0.5 - py) * 32;
      face.style.setProperty('--rx', rx.toFixed(2) + 'deg');
      face.style.setProperty('--ry', ry.toFixed(2) + 'deg');
      face.style.setProperty('--mx', (px * 100) + '%');
      face.style.setProperty('--my', (py * 100) + '%');
      rafId = null;
    };

    btn.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch' && e.buttons === 0) return;
      lastEvt = e;
      if (!rafId) rafId = requestAnimationFrame(update);
    }, { passive: true });

    btn.addEventListener('pointerleave', () => {
      lastEvt = null;
      face.style.setProperty('--rx', '0deg');
      face.style.setProperty('--ry', '0deg');
    });
  });
}

/* ============================================================
   БЛОК 7. ИГРА 1 — «УГАДАЙ ГЕРОЯ»
   ============================================================ */

const heroPool = [
  { emoji: '🐻', name: 'Медведь' },
  { emoji: '🐺', name: 'Волк' },
  { emoji: '🦊', name: 'Лиса' },
  { emoji: '🐰', name: 'Заяц' },
  { emoji: '🐸', name: 'Лягушка' },
  { emoji: '🐭', name: 'Мышка' },
  { emoji: '🐔', name: 'Курочка Ряба' },
  { emoji: '🐷', name: 'Поросёнок' },
  { emoji: '👧', name: 'Красная Шапочка' },
  { emoji: '👸', name: 'Принцесса' },
  { emoji: '🤴', name: 'Принц' },
  { emoji: '🧙', name: 'Волшебник' },
  { emoji: '🐉', name: 'Дракон' },
  { emoji: '👴', name: 'Дед' },
  { emoji: '👵', name: 'Бабушка' }
];

const TOTAL_QUESTIONS = 10;

const g1 = { questions: [], index: 0, locked: false };

function buildQuestions() {
  const shuffledPool = shuffle(heroPool);
  const questions = [];
  for (let i = 0; i < TOTAL_QUESTIONS; i++) {
    const hero = shuffledPool[i % shuffledPool.length];
    const others = heroPool.filter(h => h.name !== hero.name);
    const wrongs = shuffle(others).slice(0, 2);
    questions.push({
      emoji: hero.emoji,
      answer: hero.name,
      options: shuffle([hero.name, wrongs[0].name, wrongs[1].name])
    });
  }
  return questions;
}

function startGame1() {
  lastGame = 1;
  g1.questions = buildQuestions();
  g1.index = 0;
  g1.locked = false;
  currentStars = 0;
  updateHudStars();
  showScreen('screen-game1', true, '🔍 Угадай героя');
  initHeroTilt();
  renderQuestion1();
}

/** 3D-наклон героя за указателем */
function initHeroTilt() {
  const scene = document.getElementById('g1-scene');
  const tilt = document.getElementById('g1-tilt');
  if (!scene || !tilt || scene.dataset.heroTilt) return;
  scene.dataset.heroTilt = '1';

  let rafId = null;
  let lastEvt = null;

  const update = () => {
    if (!lastEvt) { rafId = null; return; }
    const e = lastEvt;
    const r = scene.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const hy = (px - 0.5) * 30;
    const hx = (0.5 - py) * 30;
    tilt.style.setProperty('--hx', hx.toFixed(2) + 'deg');
    tilt.style.setProperty('--hy', hy.toFixed(2) + 'deg');
    rafId = null;
  };

  scene.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' && e.buttons === 0) return;
    lastEvt = e;
    if (!rafId) rafId = requestAnimationFrame(update);
  }, { passive: true });

  scene.addEventListener('pointerleave', () => {
    lastEvt = null;
    tilt.style.setProperty('--hx', '0deg');
    tilt.style.setProperty('--hy', '0deg');
  });
}

function renderQuestion1() {
  const q = g1.questions[g1.index];
  if (!q) return;

  g1.locked = false;

  const emojiEl = document.getElementById('g1-emoji');
  emojiEl.textContent = q.emoji;
  emojiEl.classList.remove('pop', 'spin3d', 'tada');
  void emojiEl.offsetWidth;
  emojiEl.classList.add('pop');

  document.getElementById('g1-question').textContent = 'Кто это?';
  document.getElementById('g1-feedback').textContent = '';
  document.getElementById('g1-feedback').className = 'feedback';

  const optionsBox = document.getElementById('g1-options');
  optionsBox.innerHTML = '';

  q.options.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = name;
    btn.onclick = () => answerQuestion1(btn, name, q);
    btn.onmouseenter = () => speak(name);
    optionsBox.appendChild(btn);
    // 3D-наклон на каждой кнопке ответа
    attach3DTilt(btn, 14, 22, false);
  });

  updateHudProgress((g1.index + 1) + ' / ' + TOTAL_QUESTIONS);
  speak('Кто это?', true);
}

function answerQuestion1(btn, name, q) {
  if (g1.locked) return;

  if (name === q.answer) {
    /* ---- ПРАВИЛЬНО ---- */
    g1.locked = true;
    btn.classList.add('correct');
    flash('green');
    soundCorrect();
    confetti(34);

    currentStars++;
    updateHudStars();

    // 3D-вращение героя при правильном ответе
    const emojiEl = document.getElementById('g1-emoji');
    emojiEl.classList.remove('pop', 'tada');
    void emojiEl.offsetWidth;
    emojiEl.classList.add('spin3d');

    showFeedback('g1-feedback', 'Молодец! 🎉', true);
    speak('Молодец! Это ' + name, true);

    setTimeout(() => {
      g1.index++;
      if (g1.index >= g1.questions.length) {
        endGame(1);
      } else {
        renderQuestion1();
      }
    }, 1700);

  } else {
    /* ---- НЕПРАВИЛЬНО ---- */
    btn.classList.add('wrong');
    btn.disabled = true;
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');

    // Лёгкое 3D-покачивание героя
    const emojiEl = document.getElementById('g1-emoji');
    emojiEl.classList.remove('tada');
    void emojiEl.offsetWidth;
    emojiEl.classList.add('tada');

    flash('red');
    soundWrong();
    showFeedback('g1-feedback', 'Попробуй ещё 🙂', false);
    speak('Попробуй ещё', true);
  }
}

/* ============================================================
   БЛОК 8. ИГРА 2 — «НАЙДИ ПАРУ» (3D МЕМОРИ)
   ============================================================ */

const memoryPairs = [
  { a: '👧', an: 'Красная Шапочка', b: '🥧', bn: 'Пирожок' },
  { a: '👸', an: 'Золушка',         b: '👠', bn: 'Туфелька' },
  { a: '🪵', an: 'Буратино',        b: '🔑', bn: 'Золотой ключик' },
  { a: '👴', an: 'Дед',             b: '🥕', bn: 'Репка' },
  { a: '🐔', an: 'Курочка Ряба',    b: '🥚', bn: 'Золотое яйцо' },
  { a: '🐻', an: 'Медведь',         b: '🏠', bn: 'Теремок' },
  { a: '🐺', an: 'Волк',            b: '🐷', bn: 'Поросёнок' },
  { a: '🧙', an: 'Волшебник',       b: '🪄', bn: 'Волшебная палочка' }
];

const PAIRS_COUNT = 6;

const g2 = { deck: [], flipped: [], matched: 0, locked: false };

function startGame2() {
  lastGame = 2;
  const chosenPairs = shuffle(memoryPairs).slice(0, PAIRS_COUNT);

  g2.deck = [];
  chosenPairs.forEach((pair, pairId) => {
    g2.deck.push({ pairId: pairId, emoji: pair.a, name: pair.an });
    g2.deck.push({ pairId: pairId, emoji: pair.b, name: pair.bn });
  });
  shuffle(g2.deck);

  g2.flipped = [];
  g2.matched = 0;
  g2.locked = false;

  currentStars = 0;
  updateHudStars();
  updateHudProgress('0 / ' + PAIRS_COUNT);

  showScreen('screen-game2', true, '🃏 Найди пару');
  renderMemory2();
  speak('Найди пару для каждого героя!', true);
}

function renderMemory2() {
  const grid = document.getElementById('g2-grid');
  grid.innerHTML = '';
  document.getElementById('g2-feedback').textContent = '';
  document.getElementById('g2-feedback').className = 'feedback';

  g2.deck.forEach((card, idx) => {
    const cardEl = document.createElement('button');
    cardEl.className = 'mem-card';
    cardEl.setAttribute('aria-label', 'Карточка');

    cardEl.innerHTML =
      '<div class="mem-inner">' +
        '<div class="mem-face mem-back">❓</div>' +
        '<div class="mem-face mem-front">' + card.emoji + '</div>' +
      '</div>';

    cardEl.addEventListener('click', () => onMemoryClick(cardEl, card, idx));
    grid.appendChild(cardEl);
  });
}

function onMemoryClick(cardEl, card, idx) {
  if (g2.locked) return;
  if (cardEl.classList.contains('flipped')) return;
  if (cardEl.classList.contains('matched')) return;

  soundFlip();
  cardEl.classList.add('flipped');
  speak(card.name);

  g2.flipped.push({ el: cardEl, data: card, idx: idx });

  if (g2.flipped.length === 2) {
    g2.locked = true;
    const first = g2.flipped[0];
    const second = g2.flipped[1];

    if (first.data.pairId === second.data.pairId && first.idx !== second.idx) {
      /* ---- ПАРА НАЙДЕНА ---- */
      setTimeout(() => {
        first.el.classList.add('matched');
        second.el.classList.add('matched');

        soundCorrect();
        confetti(28);
        currentStars++;
        updateHudStars();

        g2.matched++;
        updateHudProgress(g2.matched + ' / ' + PAIRS_COUNT);
        showFeedback('g2-feedback', 'Молодец! 🎉', true);

        g2.flipped = [];
        g2.locked = false;

        if (g2.matched === PAIRS_COUNT) {
          setTimeout(() => endGame(2), 1100);
        }
      }, 500);

    } else {
      /* ---- НЕ ПАРА ---- */
      setTimeout(() => {
        first.el.classList.remove('flipped');
        second.el.classList.remove('flipped');
        soundWrong();
        showFeedback('g2-feedback', 'Попробуй ещё 🙂', false);
        g2.flipped = [];
        g2.locked = false;
      }, 1100);
    }
  }
}

/* ============================================================
   БЛОК 9. ИГРА 3 — «СОБЕРИ СКАЗКУ» (3D)
   ============================================================ */

const stories = [
  {
    title: '🥕 Репка',
    hint: 'Кто за кем тянул репку? Нажимай по порядку!',
    items: [
      { emoji: '👴', name: 'Дед' },
      { emoji: '👵', name: 'Бабка' },
      { emoji: '👧', name: 'Внучка' },
      { emoji: '🐕', name: 'Жучка' },
      { emoji: '🐈', name: 'Кошка' },
      { emoji: '🐭', name: 'Мышка' }
    ]
  },
  {
    title: '🏠 Теремок',
    hint: 'Кто первым поселился в теремке?',
    items: [
      { emoji: '🐭', name: 'Мышка-норушка' },
      { emoji: '🐸', name: 'Лягушка-квакушка' },
      { emoji: '🐰', name: 'Зайчик-побегайчик' },
      { emoji: '🦊', name: 'Лисичка-сестричка' },
      { emoji: '🐺', name: 'Волчок — серый бочок' },
      { emoji: '🐻', name: 'Медведь' }
    ]
  }
];

const g3 = { storyIndex: 0, placed: 0, locked: false };

function startGame3() {
  lastGame = 3;
  g3.storyIndex = 0;
  g3.placed = 0;
  g3.locked = false;
  currentStars = 0;
  updateHudStars();
  showScreen('screen-game3', true, '📖 Собери сказку');
  renderStory3();
}

function renderStory3() {
  const story = stories[g3.storyIndex];
  if (!story) return;

  g3.placed = 0;
  g3.locked = false;

  document.getElementById('g3-title').textContent = '📖 ' + story.title;
  document.getElementById('g3-hint').textContent = story.hint;
  document.getElementById('g3-feedback').textContent = '';
  document.getElementById('g3-feedback').className = 'feedback';

  updateHudProgress((g3.storyIndex + 1) + ' / ' + stories.length);

  // Пустые слоты
  const slotsBox = document.getElementById('g3-slots');
  slotsBox.innerHTML = '';
  story.items.forEach((item, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.slot = i;
    slot.innerHTML = '<span class="slot-num">' + (i + 1) + '</span>';
    slotsBox.appendChild(slot);
  });

  // Перемешанные герои
  const poolBox = document.getElementById('g3-pool');
  poolBox.innerHTML = '';

  const shuffledItems = shuffle(story.items.map((it, i) => ({
    emoji: it.emoji, name: it.name, idx: i
  })));

  shuffledItems.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'pool-item';
    btn.innerHTML =
      '<span class="pool-emoji">' + item.emoji + '</span>' +
      '<span class="pool-name">' + item.name + '</span>';
    btn.onclick = () => pickStoryItem(btn, item, story);
    btn.onmouseenter = () => speak(item.name);
    poolBox.appendChild(btn);
    // 3D-наклон на каждом герое
    attach3DTilt(btn, 16, 26, false);
  });

  speak(story.hint, true);
}

function pickStoryItem(btn, item, story) {
  if (g3.locked) return;
  if (btn.classList.contains('used')) return;

  if (item.idx === g3.placed) {
    /* ---- ПРАВИЛЬНО ---- */
    btn.classList.add('used');

    const slot = document.querySelector('#g3-slots .slot[data-slot="' + g3.placed + '"]');
    if (slot) {
      slot.innerHTML =
        '<span class="slot-num">' + (g3.placed + 1) + '</span>' +
        '<span class="pool-emoji">' + item.emoji + '</span>';
      slot.classList.add('filled');
    }

    soundCorrect();
    confetti(20);
    currentStars++;
    updateHudStars();
    speak(item.name);
    showFeedback('g3-feedback', 'Верно! 🎉', true);

    g3.placed++;

    if (g3.placed === story.items.length) {
      g3.locked = true;
      showFeedback('g3-feedback', 'Сказка собрана! 🌟', true);
      setTimeout(() => {
        g3.storyIndex++;
        if (g3.storyIndex >= stories.length) {
          endGame(3);
        } else {
          renderStory3();
        }
      }, 1600);
    }

  } else {
    /* ---- НЕПРАВИЛЬНО ---- */
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
    soundWrong();
    showFeedback('g3-feedback', 'Попробуй ещё 🙂', false);
    speak('Попробуй ещё', true);
  }
}

/* ============================================================
   БЛОК 10. ЗАВЕРШЕНИЕ ИГРЫ И ЭКРАН ПОБЕДЫ
   ============================================================ */

function endGame(gameNumber) {
  setBest(gameNumber, currentStars);
  updateBestDisplay();

  confetti(95);
  soundWin();

  const titles = {
    1: 'Умница! Все герои угаданы! 🎉',
    2: 'Отлично! Все пары найдены! 🎉',
    3: 'Здорово! Все сказки собраны! 🎉'
  };

  document.getElementById('win-title').textContent = titles[gameNumber] || 'Молодец!';
  document.getElementById('win-text').textContent =
    'Ты заработал ' + currentStars + ' ' + pluralStars(currentStars) + '!';

  // 3D-звёздочки с анимацией появления
  const starsBox = document.getElementById('win-stars');
  starsBox.innerHTML = '';
  const shown = Math.min(currentStars, 12);
  for (let i = 0; i < shown; i++) {
    const s = document.createElement('span');
    s.textContent = '⭐';
    s.style.animationDelay = (i * 0.09) + 's';
    starsBox.appendChild(s);
  }

  const best = getBest(gameNumber);
  document.getElementById('win-best').textContent =
    '🏆 Твой рекорд в этой игре: ' + best + ' ⭐';

  showScreen('screen-win', false);
  speak('Молодец! Ты заработал ' + currentStars + ' звёздочек!', true);
}

function pluralStars(n) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'звёздочку';
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'звёздочки';
  return 'звёздочек';
}

/* ============================================================
   БЛОК 11. ОБРАБОТЧИКИ СОБЫТИЙ
   ============================================================ */

/* --- Кнопки меню --- */
document.querySelectorAll('.menu-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    soundClick();
    const game = parseInt(btn.dataset.game, 10);
    if (game === 1) startGame1();
    else if (game === 2) startGame2();
    else if (game === 3) startGame3();
  });
});

/* --- Кнопка «Домой» --- */
document.getElementById('btn-home').addEventListener('click', () => {
  soundClick();
  stopSpeak();
  updateBestDisplay();
  showScreen('screen-menu', false);
});

/* --- Клик по герою в игре 1 (озвучка + анимация) --- */
document.getElementById('g1-emoji').addEventListener('click', () => {
  const q = g1.questions[g1.index];
  if (q) {
    speak('Кто это?');
    const el = document.getElementById('g1-emoji');
    el.classList.remove('pop', 'tada');
    void el.offsetWidth;
    el.classList.add('tada');
  }
});

/* --- Кнопки на экране победы --- */
document.getElementById('btn-again').addEventListener('click', () => {
  soundClick();
  if (lastGame === 1) startGame1();
  else if (lastGame === 2) startGame2();
  else startGame3();
});

document.getElementById('btn-menu').addEventListener('click', () => {
  soundClick();
  stopSpeak();
  updateBestDisplay();
  showScreen('screen-menu', false);
});

/* --- Разблокировка аудио после первого касания --- */
document.addEventListener('pointerdown', function unlockAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
  }
  document.removeEventListener('pointerdown', unlockAudio);
}, { once: true });

/* --- Опциональный 3D-наклон по гироскопу на мобильных --- */
window.addEventListener('deviceorientation', e => {
  // Применяем только если пользователь не взаимодействует с tilt-элементами
  const tilt = document.getElementById('g1-tilt');
  if (!tilt) return;
  if (tilt.dataset.userActive) return;
  if (e.beta == null || e.gamma == null) return;
  // Ограничиваем углы
  const beta = Math.max(-30, Math.min(30, e.beta - 40));
  const gamma = Math.max(-30, Math.min(30, e.gamma));
  tilt.style.setProperty('--hx', (beta * 0.5).toFixed(1) + 'deg');
  tilt.style.setProperty('--hy', (gamma * 0.5).toFixed(1) + 'deg');
}, { passive: true });

/* ============================================================
   БЛОК 12. ИНИЦИАЛИЗАЦИЯ
   ============================================================ */

(function init() {
  updateBestDisplay();
  updateHudStars();
  initMenuTilt();
  showScreen('screen-menu', false);
})();
</script>
